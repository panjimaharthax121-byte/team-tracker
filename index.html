<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Tracker v2.24 — ApotekKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* === APOTEKKU BRAND === */
    --bg: #ffffff;           /* putih bersih */
    --bg-card: #ffffff;
    --bg-col: #f5f5f5;       /* abu sangat tipis utk kolom kanban */
    --bg-sidebar: #fafafa;   /* abu paling tipis sidebar */
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1a1a1a;         /* ink */
    --text-muted: #525252;
    --text-light: #a3a3a3;
    --primary: #dc2626;      /* ApotekKu red */
    --primary-dark: #b91c1c;
    --primary-light: #fde8e8;
    --accent: #c87f1f;       /* warm amber (TaskPro-ish action) */
    --accent-light: #fdf4e7;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --info: #2563eb;
    --info-light: #dbeafe;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.10);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-lg: 18px;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea, select { font-family: inherit; font-size: 14px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  h1, h2, h3, h4, .serif-heading { font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em; }

  /* === APP LAYOUT (sidebar + main) === */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    transition: transform .25s;
    z-index: 90;
  }
  .sidebar-brand {
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-logo {
    width: 36px; height: 36px;
    background: var(--primary);
    border-radius: var(--radius-sm);
    display: grid; place-items: center;
    color: white;
    box-shadow: 0 4px 12px rgba(220,38,38,0.25);
    flex-shrink: 0;
  }
  .sidebar-logo svg { width: 20px; height: 20px; }
  .sidebar-title {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .sidebar-nav {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .sidebar-nav-section {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    padding: 14px 12px 6px;
  }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    border: none;
    background: transparent;
    text-align: left;
    font-family: inherit;
    width: 100%;
  }
  .sidebar-nav-item:hover {
    background: rgba(0,0,0,0.04);
    color: var(--text);
  }
  .sidebar-nav-item.active {
    background: white;
    color: var(--text);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .sidebar-nav-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 15px;
  }
  .sidebar-bottom {
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  .sidebar-logout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    background: var(--primary);
    color: white;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    transition: all .15s;
    font-family: inherit;
  }
  .sidebar-logout:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }

  /* === MAIN CONTENT === */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* === TOPBAR === */
  .topbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-toggle {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: none;
    place-items: center;
    color: var(--text-muted);
    font-size: 20px;
  }
  .topbar-toggle:hover { background: var(--bg-col); }
  .topbar-welcome { flex: 1; }
  .topbar-welcome-title {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .topbar-welcome-sub {
    font-size: 13px;
    color: var(--text-muted);
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 4px;
    padding-right: 4px;
    background: transparent;
  }
  .user-badge-info {
    text-align: right;
    line-height: 1.3;
  }
  .user-badge-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .user-badge-role {
    font-size: 11px;
    color: var(--text-muted);
  }
  .user-badge-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: white;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .admin-pill {
    background: var(--accent-light);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  /* === PAGE === */
  .page-content {
    padding: 28px 32px;
    flex: 1;
    overflow-y: auto;
  }
  .page-title-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 14px;
    flex-wrap: wrap;
  }
  .page-title {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .page-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* === FILTER STRIP === */
  .filter-strip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-group-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-right: 4px;
  }
  .filter-divider {
    width: 1px;
    height: 22px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* === BUTTONS === */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    transition: all .15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #a36418; }
  .btn-accent-soft {
    background: var(--accent-light);
    color: var(--accent);
    border-color: transparent;
  }
  .btn-accent-soft:hover { background: #fae8c9; }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #15803d; }
  .btn-success-soft {
    background: var(--success-light);
    color: #15803d;
  }
  .btn-success-soft:hover { background: #bbf7d0; }
  .btn-secondary { background: var(--bg-col); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: #e9e4dc; }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--bg-col); color: var(--text); }
  .btn-ghost-soft {
    background: white;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost-soft:hover {
    background: var(--bg-col);
    color: var(--text);
  }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: var(--primary-dark); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon {
    width: 34px; height: 34px;
    padding: 0;
    border-radius: var(--radius-sm);
  }

  /* === FORMS === */
  .input, .select, .textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: white;
    font-size: 14px;
    transition: border-color .15s;
  }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--primary);
    outline-offset: 0;
  }
  .textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .form-group { margin-bottom: 14px; }

  /* === FILTER CHIPS === */
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-col);
    color: var(--text-muted);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { background: #e1e7ef; }
  .chip.active {
    background: var(--primary);
    color: white;
  }
  .chip-avatar {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: white;
    font-size: 9px;
    font-weight: 700;
  }

  /* === DATE PICKER === */
  .date-control {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
  }
  .date-nav {
    width: 28px; height: 28px;
    border-radius: var(--radius-sm);
    display: grid; place-items: center;
    color: var(--text-muted);
  }
  .date-nav:hover { background: var(--bg-col); }
  .date-input {
    border: none;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
  }
  .date-today-btn {
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
  }
  .date-today-btn:hover { background: var(--primary-light); }

  /* === KANBAN === */
  .kanban {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    min-height: 400px;
  }
  .kanban-col {
    background: var(--bg-col);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 300px;
    transition: background .15s;
  }
  .kanban-col.drag-over {
    background: #dbeafe;
    outline: 2px dashed var(--primary);
    outline-offset: -2px;
  }
  .kanban-col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .kanban-col-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .kanban-col-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .col-todo .kanban-col-icon { background: var(--text-light); }
  .col-proses .kanban-col-icon { background: var(--warning); }
  .col-done .kanban-col-icon { background: var(--success); }
  .kanban-col-count {
    background: white;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .kanban-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .kanban-empty {
    text-align: center;
    color: var(--text-light);
    padding: 24px 12px;
    font-size: 12px;
    font-style: italic;
  }
  .kanban-add-btn {
    padding: 10px;
    border-radius: var(--radius);
    border: 1px dashed var(--border-strong);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    margin-top: 4px;
    background: transparent;
  }
  .kanban-add-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: white;
  }

  /* === TASK CARD === */
  .task-card {
    background: white;
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    cursor: grab;
    transition: all .15s;
    position: relative;
  }
  .task-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .task-card.dragging {
    opacity: 0.5;
    cursor: grabbing;
  }
  .task-card.col-todo { border-left: 4px solid var(--info); }
  .task-card.col-proses { border-left: 4px solid var(--warning); }
  .task-card.col-done { border-left: 4px solid var(--success); }
  .task-card-body { cursor: pointer; }
  .task-card-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .task-card-actions .btn {
    flex: 1;
    padding: 8px 12px;
    font-size: 12.5px;
  }
  .task-card-history-btn {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    display: grid;
    place-items: center;
    font-size: 13px;
  }
  .task-card-history-btn:hover {
    background: var(--bg-col);
    color: var(--text);
  }
  .task-card.task-locked {
    background: #fafbfc;
    cursor: default;
  }
  .task-card.task-locked::after {
    content: '🔒';
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 11px;
    opacity: 0.45;
  }
  .task-card.task-locked:hover {
    transform: none;
    box-shadow: var(--shadow-sm);
  }
  .readonly-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    background: var(--bg-col);
    color: var(--text-muted);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
  }

  /* === BOARD SWITCHER === */
  .board-switcher {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .board-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-col);
    border: 1px solid transparent;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .board-chip:hover { background: #e1e7ef; }
  .board-chip.active {
    background: white;
    color: var(--text);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  .board-color {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .board-chip-new {
    border: 1px dashed var(--border-strong);
    background: transparent;
    font-size: 12px;
  }
  .board-chip-new:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  /* === CALENDAR === */
  .calendar-wrap {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .calendar-month-label {
    font-family: var(--font-serif);
    font-size: 26px;
    font-weight: 400;
  }
  .calendar-nav { display: flex; gap: 6px; align-items: center; }
  .calendar-nav-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    background: var(--bg-col);
    font-size: 14px;
    color: var(--text);
    transition: all .15s;
  }
  .calendar-nav-btn:hover { background: var(--border); }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .calendar-dow {
    padding: 10px 14px;
    background: var(--bg-col);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    text-align: center;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .calendar-dow:last-child { border-right: none; }
  .calendar-day {
    aspect-ratio: 1.2;
    min-height: 110px;
    padding: 8px 10px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: background .12s;
    position: relative;
  }
  .calendar-day:nth-child(7n) { border-right: none; }
  .calendar-day:hover { background: var(--bg-col); }
  .calendar-day.outside {
    background: #fafafa;
    color: var(--text-light);
    cursor: default;
  }
  .calendar-day.outside:hover { background: #fafafa; }
  .calendar-day.today .calendar-day-num {
    background: var(--primary);
    color: white;
    border-radius: 50%;
    width: 26px;
    height: 26px;
    display: inline-grid;
    place-items: center;
    font-weight: 700;
  }
  .calendar-day-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .calendar-day.outside .calendar-day-num { color: var(--text-light); }
  .calendar-day-stats {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: auto;
  }
  .calendar-day-mini-bar {
    height: 4px;
    border-radius: 100px;
    background: var(--bg-col);
    overflow: hidden;
    margin: 6px 0 4px;
  }
  .calendar-day-mini-bar-fill {
    height: 100%;
    background: var(--success);
    border-radius: 100px;
  }
  .calendar-day-completion {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
  }
  .calendar-day.complete .calendar-day-completion { color: var(--success); }
  .calendar-day.partial .calendar-day-completion { color: var(--warning); }
  .calendar-day.empty .calendar-day-completion { color: var(--text-light); }
  .calendar-day-counts {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 10.5px;
    line-height: 1.4;
  }
  .calendar-day-count {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .calendar-day-count.todo { background: var(--info-light); color: var(--info); }
  .calendar-day-count.proses { background: var(--warning-light); color: #92400e; }
  .calendar-day-count.done { background: var(--success-light); color: #15803d; }

  /* === RECAP TABLE === */
  .recap-table-wrap {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .recap-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .recap-table thead th {
    background: var(--bg-col);
    text-align: left;
    padding: 12px 14px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .recap-table thead th:hover { background: #ececec; }
  .recap-table thead th.sorted::after {
    content: ' ↓';
    color: var(--primary);
  }
  .recap-table thead th.sorted.asc::after { content: ' ↑'; }
  .recap-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .recap-table tbody tr:hover { background: var(--bg-col); cursor: pointer; }
  .recap-table tbody tr:last-child { border-bottom: none; }
  .recap-table td {
    padding: 12px 14px;
    vertical-align: middle;
  }
  .recap-table td.cell-title { font-weight: 600; color: var(--text); }
  .recap-table td.cell-date { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .recap-table .mini-progress {
    width: 70px;
    height: 4px;
    background: var(--bg-col);
    border-radius: 100px;
    overflow: hidden;
    display: inline-block;
    margin-right: 6px;
    vertical-align: middle;
  }
  .recap-table .mini-progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 100px;
  }
  .recap-table .status-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .recap-table .status-pill.todo { background: var(--info-light); color: var(--info); }
  .recap-table .status-pill.proses { background: var(--warning-light); color: #92400e; }
  .recap-table .status-pill.done { background: var(--success-light); color: #15803d; }
  .recap-table-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .recap-summary {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .recap-summary-card {
    flex: 1;
    min-width: 150px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
  }
  .recap-summary-label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .recap-summary-value {
    font-family: var(--font-serif);
    font-size: 32px;
    font-weight: 400;
  }
  .recap-summary-detail {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* === TIME TRACKER === */
  .time-tracker-box {
    background: var(--bg-col);
    padding: 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 12px;
  }
  .time-tracker-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .time-tracker-display {
    flex: 1;
    min-width: 140px;
  }
  .time-tracker-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .time-tracker-total {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .time-tracker-running {
    color: var(--success);
    animation: pulse-time 1.5s ease-in-out infinite;
  }
  @keyframes pulse-time {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .time-tracker-sessions {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-muted);
    max-height: 100px;
    overflow-y: auto;
  }
  .time-tracker-session {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
  }
  .time-badge-card {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }

  /* === MENTION HIGHLIGHT === */
  .mention {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 700;
    font-size: 0.95em;
  }
  .chat-msg.mine .mention {
    background: rgba(255,255,255,0.25);
    color: white;
  }
  /* v2.24: Mention picker dropdown */
  .mention-picker-item:hover { background: var(--bg-col) !important; }

  /* === KENDALA BADGE === */
  .kendala-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    background: var(--danger-light);
    color: #991b1b;
    margin-bottom: 6px;
    margin-right: 4px;
  }
  .kendala-box {
    padding: 12px 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-left: 3px solid var(--danger);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
  }
  .kendala-label {
    font-size: 11px;
    font-weight: 700;
    color: #991b1b;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
  }
  .kendala-text {
    font-size: 13px;
    color: #7f1d1d;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  /* === CARRY-OVER BADGE === */
  .carryover-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    background: var(--warning-light);
    color: #92400e;
    margin-bottom: 6px;
  }

  /* === CHAT PAGE === */
  .chat-shell {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 200px);
    min-height: 480px;
    overflow: hidden;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .chat-day-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0 6px;
    color: var(--text-light);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .chat-day-divider::before, .chat-day-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .chat-msg {
    display: flex;
    gap: 10px;
    max-width: 78%;
    align-self: flex-start;
  }
  .chat-msg.mine {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .chat-msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: white;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .chat-msg-bubble {
    background: var(--bg-col);
    border-radius: 14px;
    padding: 9px 13px;
    min-width: 60px;
    position: relative;
  }
  .chat-msg.mine .chat-msg-bubble {
    background: var(--primary);
    color: white;
  }
  .chat-msg-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .chat-msg.mine .chat-msg-head { justify-content: flex-end; }
  .chat-msg-author {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .chat-msg.mine .chat-msg-author { color: white; opacity: 0.95; }
  .chat-msg-time {
    font-size: 10.5px;
    color: var(--text-light);
    font-family: var(--font-mono);
  }
  .chat-msg.mine .chat-msg-time { color: rgba(255,255,255,0.7); }
  .chat-msg-text {
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.mine .chat-msg-text { color: white; }
  .chat-msg-del {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
  }
  .chat-msg:hover .chat-msg-del { display: flex; }
  .chat-msg-del:hover { background: var(--danger-light); color: var(--danger); }
  .chat-msg.deleted .chat-msg-bubble {
    background: var(--bg-col) !important;
    color: var(--text-light) !important;
    font-style: italic;
  }
  .chat-msg.deleted .chat-msg-text {
    color: var(--text-light) !important;
    font-size: 12px;
  }
  .chat-msg.deleted .chat-msg-del { display: none !important; }
  .chat-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .chat-empty-icon { font-size: 48px; opacity: 0.5; margin-bottom: 8px; }
  .chat-input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: white;
    align-items: flex-end;
  }
  .chat-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14px;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    background: var(--bg-col);
  }
  .chat-input:focus { outline: 2px solid var(--primary); outline-offset: -1px; background: white; }
  .chat-send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    display: grid; place-items: center;
    font-size: 18px;
    cursor: pointer;
    transition: all .15s;
    flex-shrink: 0;
    border: none;
  }
  .chat-send-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
  .chat-send-btn:disabled { background: var(--border-strong); cursor: not-allowed; transform: none; }

  /* Sidebar nav badge for unread count */
  .sidebar-nav-badge {
    margin-left: auto;
    background: var(--primary);
    color: white;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 100px;
    min-width: 20px;
    text-align: center;
    font-family: var(--font-mono);
  }

  /* === PROJECT PAGE (menu Tugas Proyek tersendiri) === */
  .project-list { display: flex; flex-direction: column; gap: 14px; }
  .project-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    transition: all .15s;
    border-left: 4px solid #8b5cf6;
  }
  .project-card:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .project-card.status-done { border-left-color: var(--success); opacity: 0.85; }
  .project-card.status-proses { border-left-color: var(--warning); }
  .project-card.overdue { border-left-color: var(--danger); background: #fef2f2; }
  .project-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .project-card-title {
    font-family: var(--font-serif);
    font-size: 19px;
    font-weight: 400;
    line-height: 1.3;
    color: var(--text);
  }
  .project-card-meta-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .project-card-meta-bot {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .project-card-meta-bot strong { color: var(--text); }
  .project-timeline {
    margin-top: 14px;
    position: relative;
    height: 28px;
    background: var(--bg-col);
    border-radius: 6px;
    overflow: visible;
  }
  .project-timeline-bar {
    position: absolute;
    top: 0;
    bottom: 0;
    background: linear-gradient(90deg, #ddd6fe 0%, #c4b5fd 100%);
    border-radius: 6px;
  }
  .project-timeline-bar.proses {
    background: linear-gradient(90deg, #fde68a 0%, #f59e0b 100%);
  }
  .project-timeline-bar.done {
    background: linear-gradient(90deg, #bbf7d0 0%, var(--success) 100%);
  }
  .project-timeline-bar.overdue {
    background: linear-gradient(90deg, #fecaca 0%, var(--danger) 100%);
  }
  .project-timeline-progress {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    background: rgba(0,0,0,0.18);
    border-radius: 6px 0 0 6px;
  }
  .project-timeline-today {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 2px;
    background: var(--primary);
    z-index: 2;
  }
  .project-timeline-today::before {
    content: '';
    position: absolute;
    top: -3px;
    left: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
  }
  .project-timeline-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    font-family: var(--font-mono);
  }
  .project-days-left {
    font-family: var(--font-mono);
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 100px;
    font-size: 12px;
    white-space: nowrap;
  }
  .project-days-left.fine { background: #ede9fe; color: #6b21a8; }
  .project-days-left.warn { background: var(--warning-light); color: #92400e; }
  .project-days-left.overdue { background: var(--danger-light); color: #991b1b; }
  .project-days-left.done { background: var(--success-light); color: #15803d; }
  .project-empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-light);
  }
  .project-empty-icon {
    font-size: 56px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .project-filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--bg-col);
    border: 1px solid transparent;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .project-filter-pill:hover { background: #e8e8e8; }
  .project-filter-pill.active {
    background: #ede9fe;
    color: #6b21a8;
    border-color: #c4b5fd;
    font-weight: 700;
  }

  /* === PROJECT BADGE === */
  .project-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    background: #ede9fe;
    color: #6b21a8;
    margin-bottom: 6px;
    margin-right: 4px;
    font-family: var(--font-mono);
  }
  .project-badge.overdue {
    background: var(--danger-light);
    color: #991b1b;
  }

  /* === SHARED TASK BADGE === */
  .shared-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    background: var(--success-light);
    color: #15803d;
    margin-bottom: 6px;
    margin-right: 4px;
  }

  /* === FREQUENCY BADGE (task dari template recurring) === */
  .freq-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 6px;
    margin-right: 4px;
  }
  .freq-badge.daily   { background: #fde8e8; color: #b91c1c; }
  .freq-badge.weekly  { background: #dbeafe; color: #1d4ed8; }
  .freq-badge.monthly { background: #fef3c7; color: #92400e; }

  /* === TARGET COUNTER === */
  .target-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    background: var(--info-light);
    color: var(--info);
    font-family: var(--font-mono);
  }
  .target-badge.done { background: var(--success-light); color: #15803d; }
  .target-control {
    background: var(--bg-col);
    padding: 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 14px;
  }
  .target-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .target-row > label {
    flex: 1;
    min-width: 160px;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }
  .target-row > label small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .target-input-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .target-input-group input {
    width: 70px;
    border: none;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    padding: 4px;
    background: transparent;
  }
  .target-input-group input:focus { outline: none; }
  .target-step-btn {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    background: var(--bg-col);
    color: var(--text);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: background .1s;
  }
  .target-step-btn:hover:not(:disabled) { background: var(--border-strong); }
  .target-step-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .target-display {
    flex: 0 0 auto;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--info);
    padding: 8px 18px;
    background: var(--info-light);
    border-radius: var(--radius-sm);
    min-width: 110px;
  }
  .target-display.done { color: var(--success); background: var(--success-light); }

  /* === CATEGORY BADGE === */
  .category-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border: 1px solid currentColor;
    margin-bottom: 8px;
    background: transparent;
  }
  .category-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .category-select {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .category-option {
    flex: 1;
    min-width: 110px;
    padding: 14px 16px;
    background: white;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    text-align: left;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .category-option:hover:not(:disabled) {
    border-color: currentColor;
  }
  .category-option.active {
    border-color: currentColor;
    background: var(--bg-col);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
  }
  .category-option-name {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .category-option-name::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .category-option-desc {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .category-option:disabled { opacity: 0.6; cursor: not-allowed; }

  /* === LABEL CHIPS (di task card & modal) === */
  .label-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 600;
    color: white;
    line-height: 1.4;
  }
  .label-chip-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .label-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all .15s;
    background: var(--bg-col);
    color: var(--text);
    font-family: inherit;
  }
  .label-toggle.active {
    border-color: currentColor;
  }
  .label-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* === COLOR PICKER === */
  .color-picker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1px var(--border);
    cursor: pointer;
    transition: transform .15s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active {
    box-shadow: 0 0 0 2px currentColor;
    transform: scale(1.05);
  }

  /* === CHECKLIST === */
  .checklist-block {
    background: var(--bg-col);
    padding: 12px 14px;
    border-radius: var(--radius);
    margin-bottom: 10px;
  }
  .checklist-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .checklist-title {
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    border: none;
    background: transparent;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .checklist-title:hover:not(:disabled) { background: rgba(0,0,0,0.04); }
  .checklist-title:focus { background: white; outline: 1px solid var(--primary); }
  .checklist-progress {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .checklist-progress-bar {
    height: 3px;
    background: white;
    border-radius: 100px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .checklist-progress-fill {
    height: 100%;
    background: var(--success);
    transition: width .25s;
  }
  .checklist-items { display: flex; flex-direction: column; gap: 4px; }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 4px;
  }
  .checklist-item:hover { background: rgba(0,0,0,0.03); }
  .checklist-item input[type="checkbox"] {
    width: 16px; height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
  }
  .checklist-item-text {
    flex: 1;
    border: none;
    background: transparent;
    padding: 4px;
    font-size: 13px;
    border-radius: 4px;
  }
  .checklist-item-text:hover:not(:disabled) { background: rgba(0,0,0,0.04); }
  .checklist-item-text:focus { background: white; outline: 1px solid var(--primary); }
  .checklist-item-text.checked { text-decoration: line-through; color: var(--text-muted); }
  .checklist-item-delete {
    width: 22px; height: 22px;
    color: var(--text-light);
    font-size: 14px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .15s;
  }
  .checklist-item:hover .checklist-item-delete { opacity: 1; }
  .checklist-item-delete:hover { background: var(--danger-light); color: var(--danger); }
  .checklist-add-btn {
    width: 100%;
    padding: 6px;
    background: transparent;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 6px;
  }
  .checklist-add-btn:hover { color: var(--primary); border-color: var(--primary); }

  /* === TIME BADGE === */
  .time-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    background: #f3e8ff;
    color: #6b21a8;
    font-family: var(--font-mono);
  }

  /* === DUE DATE BADGE === */
  .due-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--bg-col);
    color: var(--text-muted);
  }
  .due-badge.overdue {
    background: var(--danger-light);
    color: #991b1b;
  }
  .due-badge.today {
    background: var(--warning-light);
    color: #92400e;
  }
  .due-badge.soon {
    background: var(--primary-light);
    color: #1d4ed8;
  }
  .due-badge.done {
    background: var(--success-light);
    color: #065f46;
  }

  /* === ACTIVITY LOG === */
  .activity-list {
    max-height: 220px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .activity-item {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--bg-col);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    font-size: 11px;
  }
  .activity-content { flex: 1; line-height: 1.5; }
  .activity-actor { color: var(--text); font-weight: 600; }
  .activity-time { font-size: 10.5px; color: var(--text-light); }

  /* === PROGRESS BAR (di kanban card) === */
  .task-card-progress {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .task-card-progress-track {
    flex: 1;
    height: 5px;
    background: var(--bg-col);
    border-radius: 100px;
    overflow: hidden;
  }
  .task-card-progress-fill {
    height: 100%;
    background: var(--primary);
    transition: width .25s ease-out;
    border-radius: 100px;
  }
  .task-card-progress-fill.done { background: var(--success); }
  .task-card-progress-fill.in-progress { background: var(--warning); }
  .task-card-progress-fill.zero { background: var(--text-light); }
  .task-card-progress-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 32px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* === PROGRESS CONTROL (di modal task) === */
  .progress-control {
    background: var(--bg-col);
    padding: 14px 16px;
    border-radius: var(--radius);
    margin-bottom: 14px;
  }
  .progress-control-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .progress-control-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
  }
  .progress-control-value.done { color: var(--success); }
  .progress-control-value.in-progress { color: var(--warning); }
  .progress-control-status-hint {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  input[type="range"].progress-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    background: white;
    border-radius: 100px;
    outline: none;
    border: 1px solid var(--border);
    margin: 6px 0;
  }
  input[type="range"].progress-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    background: var(--primary);
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  input[type="range"].progress-slider::-moz-range-thumb {
    width: 22px;
    height: 22px;
    background: var(--primary);
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  input[type="range"].progress-slider:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .progress-quick-row {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }
  .progress-quick-btn {
    flex: 1;
    padding: 6px 8px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .progress-quick-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
  }
  .progress-quick-btn.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .progress-quick-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .task-card-title {
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .task-card.col-done .task-card-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .task-card-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    word-break: break-word;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .task-card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .task-card-assignee {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
  }
  .task-card-comments-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: var(--primary);
    font-weight: 600;
  }
  .avatar {
    width: 20px; height: 20px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: white;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .avatar-lg { width: 36px; height: 36px; font-size: 14px; }

  /* === MODAL === */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(2px);
    z-index: 200;
    display: grid;
    place-items: center;
    padding: 16px;
    animation: fadeIn .15s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(10px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    animation: slideUp .2s ease-out;
  }
  .modal-lg { max-width: 720px; }
  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-size: 16px;
    font-weight: 700;
  }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-close {
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    display: grid; place-items: center;
    font-size: 18px;
  }
  .modal-close:hover { background: var(--bg-col); }

  /* === TASK MODAL === */
  .task-meta-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: var(--bg-col);
    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--text-muted);
  }
  .task-meta-row > div { display: flex; align-items: center; gap: 6px; }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .status-todo { background: #e2e8f0; color: #475569; }
  .status-proses { background: var(--warning-light); color: #92400e; }
  .status-done { background: var(--success-light); color: #065f46; }

  /* === COMMENTS === */
  .comments-section { margin-top: 20px; }
  .comments-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 10px;
  }
  .comment {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .comment:first-of-type { border-top: 0; }
  .comment-content { flex: 1; }
  .comment-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .comment-author { font-weight: 600; font-size: 13px; }
  .comment-time { font-size: 11px; color: var(--text-light); }
  .comment-text {
    font-size: 13px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .comment-delete {
    color: var(--text-light);
    font-size: 11px;
    padding: 2px 6px;
    margin-left: auto;
  }
  .comment-delete:hover { color: var(--danger); }
  .comment-form {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .comment-form .textarea { min-height: 60px; font-size: 13px; }

  /* === MEMBER LIST === */
  .member-list { display: flex; flex-direction: column; gap: 8px; }
  .member-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg-col);
    border-radius: var(--radius-sm);
  }
  .member-info { flex: 1; min-width: 0; }
  .member-name { font-weight: 600; font-size: 14px; }
  .member-meta { font-size: 11px; color: var(--text-muted); }
  .member-actions { display: flex; gap: 4px; }

  /* === SETUP WIZARD === */
  .setup-shell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, #f0f4ff, #fef3f8);
  }
  .setup-card {
    background: white;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 680px;
    padding: 40px;
    min-width: 0;
  }
  .setup-card h1 {
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--primary), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .setup-card p { color: var(--text-muted); margin-bottom: 20px; }
  .setup-step {
    background: var(--bg-col);
    padding: 14px 16px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    font-size: 13px;
  }
  .setup-step strong { display: block; margin-bottom: 4px; }
  .setup-step a { color: var(--primary); font-weight: 500; }
  .setup-step code {
    background: white;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  pre.code-block {
    background: #0f172a;
    color: #e2e8f0;
    padding: 14px;
    border-radius: var(--radius-sm);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    overflow-x: auto;
    margin: 10px 0;
    line-height: 1.5;
  }
  .setup-config-input {
    width: 100%;
    min-height: 200px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    resize: vertical;
  }

  /* === LOADING === */
  .loader {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .full-loader {
    display: grid;
    place-items: center;
    min-height: 100vh;
    color: var(--text-muted);
    font-size: 14px;
  }
  .full-loader .loader { width: 32px; height: 32px; margin-bottom: 12px; }

  /* === IN-APP NOTIFICATION (WA-style banner) === */
  .app-notif-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 380px;
    pointer-events: none;
  }
  .app-notif {
    pointer-events: auto;
    background: white;
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.18), 0 4px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    padding: 14px 14px 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: notifSlideIn .3s ease-out;
    cursor: pointer;
    transition: transform .15s;
    position: relative;
    overflow: hidden;
  }
  .app-notif:hover { transform: translateX(-4px); }
  .app-notif::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--primary);
  }
  .app-notif.type-new::before { background: var(--info); }
  .app-notif.type-start::before { background: var(--warning); }
  .app-notif.type-daily::before { background: var(--primary); }
  .app-notif-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary-light);
    display: grid;
    place-items: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .app-notif.type-new .app-notif-icon { background: var(--info-light); }
  .app-notif.type-start .app-notif-icon { background: var(--warning-light); }
  .app-notif-body {
    flex: 1;
    min-width: 0;
  }
  .app-notif-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .app-notif-message {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .app-notif-time {
    font-size: 10.5px;
    color: var(--text-light);
    margin-top: 4px;
    font-family: var(--font-mono);
  }
  .app-notif-close {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg-col);
    color: var(--text-muted);
    display: grid;
    place-items: center;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    border: none;
    transition: all .15s;
  }
  .app-notif-close:hover {
    background: var(--danger-light);
    color: var(--danger);
  }
  .app-notif-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: var(--primary);
    border-radius: 0 100px 0 0;
    animation: notifProgress 10s linear;
  }
  .app-notif.type-new .app-notif-progress { background: var(--info); }
  .app-notif.type-start .app-notif-progress { background: var(--warning); }
  @keyframes notifSlideIn {
    from { transform: translateX(110%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes notifSlideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(110%); opacity: 0; }
  }
  @keyframes notifProgress {
    from { width: 100%; }
    to { width: 0%; }
  }
  .app-notif.dismissing { animation: notifSlideOut .25s ease-in forwards; }
  @media (max-width: 600px) {
    .app-notif-container {
      top: 10px;
      right: 10px;
      left: 10px;
      max-width: none;
    }
  }

  /* === TOAST === */
  .toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .toast {
    background: var(--text);
    color: white;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    box-shadow: var(--shadow-lg);
    animation: slideUp .2s ease-out;
    max-width: 320px;
  }
  .toast-success { background: var(--success); }
  .toast-error { background: var(--danger); }

  /* === EMPTY STATE === */
  .empty-page {
    display: grid;
    place-items: center;
    padding: 60px 20px;
    color: var(--text-muted);
    text-align: center;
  }
  .empty-page-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty-page-title { font-weight: 600; font-size: 16px; margin-bottom: 6px; color: var(--text); }

/* =============================================================

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dateLabel(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const today = todayStr();
  const yest = (() => { const t = new Date(); t.setDate(t.getDate() - 1); return [t.getFullYear(), String(t.getMonth()+1).padStart(2,'0'), String(t.getDate()).padStart(2,'0')].join('-'); })();
  if (dateStr === today) return 'Hari ini';
  if (dateStr === yest) return 'Kemarin';
  return dt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
}
function shiftDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}
function timeAgo(date) {
  if (!date) return '';
  const d = date instanceof Date ? date : (date.toDate ? date.toDate() : new Date(date));
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return 'baru saja';
  if (sec < 3600) return `${Math.floor(sec / 60)}m lalu`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}j lalu`;
  if (sec < 604800) return `${Math.floor(sec / 86400)}h lalu`;
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
}
function colorFor(name) {
  const s = String(name || '');
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

async function requestNotifPermission() {
  if (!('Notification' in window)) {
    toast('Browser ini tidak support notifikasi', 'error');
    return false;
  }
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') {
    toast('Notif di-block. Buka settings browser untuk allow.', 'error');
    return false;
  }
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}
function showNotif(title, body, opts = {}) {
  // Native browser notif (untuk tab background)
  if (('Notification' in window) && Notification.permission === 'granted') {
    try {
      const n = new Notification(title, {
        body,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%23dc2626"><path d="M8 2h4v6h6v4h-6v6H8v-6H2V8h6z"/></svg>',
        tag: opts.tag,
        requireInteraction: opts.persist || false,

      n.onclick = () => {
        window.focus();
        n.close();
        if (opts.onClick) opts.onClick();
      };
      setTimeout(() => n.close(), 8000);
    } catch (e) { console.error('Native notif failed', e); }
  }
  // In-app notif (WA-style banner) — selalu tampil di app
  showAppNotif(title, body, opts);
}

// In-app notification (custom UI banner kanan atas)
let _appNotifCount = 0;
function showAppNotif(title, body, opts = {}) {
  const root = document.getElementById('app-notif-root');
  if (!root) return;
  const id = 'an-' + (++_appNotifCount);
  const type = opts.type || 'default';
  const icon = opts.icon || (type === 'new' ? '🆕' : type === 'start' ? '⏰' : type === 'daily' ? '📋' : '🔔');
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const el = document.createElement('div');
  el.className = `app-notif type-${type}`;
  el.dataset.notifId = id;
  el.innerHTML = `
    <div class="app-notif-icon">${icon}</div>
    <div class="app-notif-body">
      <div class="app-notif-title">${escapeHtml(title)}</div>
      <div class="app-notif-message">${escapeHtml(body)}</div>
      <div class="app-notif-time">${timeStr}</div>
    </div>
    <button class="app-notif-close" data-close-notif title="Tutup">✕</button>
    <div class="app-notif-progress"></div>
  `;
  // Click handler — execute onClick action lalu close
  el.addEventListener('click', (e) => {
    if (e.target.closest('[data-close-notif]')) return;
    dismissAppNotif(el);
    if (opts.onClick) opts.onClick();
  });
  el.querySelector('[data-close-notif]').addEventListener('click', (e) => {
    e.stopPropagation();
    dismissAppNotif(el);
  });
  root.appendChild(el);

  // Auto-dismiss after 10s
  const timeout = setTimeout(() => dismissAppNotif(el), 10000);
  el.dataset.timeout = timeout;

  // Limit max 5 stacked notif — kick oldest
  while (root.children.length > 5) {
    dismissAppNotif(root.firstChild, true);
  }
}

function dismissAppNotif(el, immediate = false) {
  if (!el || !el.parentNode) return;
  if (el.dataset.timeout) clearTimeout(parseInt(el.dataset.timeout, 10));
  if (immediate) { el.remove(); return; }
  el.classList.add('dismissing');
  setTimeout(() => el.remove(), 250);
}
function playNotifSound() {
  if (!STATE.notifSettings?.enabled || !STATE.notifSettings?.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // ~3 detik alarm pattern: 2 phrase × 4-tone, vibes notifikasi WA tapi lebih keras
    const phrase = [
      { freq: 1200, dur: 0.20 },
      { freq:  900, dur: 0.18 },
      { freq: 1500, dur: 0.18 },
      { freq: 1100, dur: 0.34 },
    ];
    const gapInPhrase = 0.06;
    const gapBetweenPhrase = 0.20;
    let cursor = ctx.currentTime + 0.02;
    // Master compressor
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-22, ctx.currentTime);
    compressor.knee.setValueAtTime(6, ctx.currentTime);
    compressor.ratio.setValueAtTime(10, ctx.currentTime);
    compressor.attack.setValueAtTime(0.003, ctx.currentTime);
    compressor.release.setValueAtTime(0.08, ctx.currentTime);
    compressor.connect(ctx.destination);

    const playTone = (freq, dur, time) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const lpf = ctx.createBiquadFilter();
      lpf.type = 'lowpass';
      lpf.frequency.value = 4000;
      lpf.Q.value = 1;
      osc.connect(lpf);
      lpf.connect(gain);
      gain.connect(compressor);
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(0.95, time + 0.012);
      gain.gain.setValueAtTime(0.95, time + dur - 0.06);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      osc.start(time);
      osc.stop(time + dur + 0.02);
    };

    // Phrase 1
    phrase.forEach(({ freq, dur }) => {
      playTone(freq, dur, cursor);
      cursor += dur + gapInPhrase;
    });
    // Gap
    cursor += gapBetweenPhrase;
    // Phrase 2
    phrase.forEach(({ freq, dur }) => {
      playTone(freq, dur, cursor);
      cursor += dur + gapInPhrase;
    });
  } catch (e) { console.error('Sound failed', e); }
}

// v2.20: Sound khusus chat — pendek (~0.5 detik), 2-tone ding-dong, tetap keras
function playChatSound() {
  if (!STATE.notifSettings?.enabled || !STATE.notifSettings?.chatSoundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Pattern: ding (1400Hz, 0.16s) → pause 0.05s → dong (900Hz, 0.22s)
    const tones = [
      { freq: 1400, dur: 0.16 },
      { freq:  900, dur: 0.22 },
    ];
    const gap = 0.05;
    let cursor = ctx.currentTime + 0.02;
    // Compressor untuk loudness max
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-22, ctx.currentTime);
    compressor.knee.setValueAtTime(6, ctx.currentTime);
    compressor.ratio.setValueAtTime(10, ctx.currentTime);
    compressor.attack.setValueAtTime(0.003, ctx.currentTime);
    compressor.release.setValueAtTime(0.08, ctx.currentTime);
    compressor.connect(ctx.destination);

    tones.forEach(({ freq, dur }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const lpf = ctx.createBiquadFilter();
      lpf.type = 'lowpass';
      lpf.frequency.value = 4000;
      lpf.Q.value = 1;
      osc.connect(lpf);
      lpf.connect(gain);
      gain.connect(compressor);
      osc.type = 'square'; // tetap keras
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, cursor);
      gain.gain.exponentialRampToValueAtTime(0.95, cursor + 0.01);
      gain.gain.setValueAtTime(0.95, cursor + dur - 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, cursor + dur);
      osc.start(cursor);
      osc.stop(cursor + dur + 0.02);
      cursor += dur + gap;
    });
  } catch (e) { console.error('Chat sound failed', e); }
}

// Background timer untuk cek reminder harian + startTime task
let _reminderTimer = null;
function startReminderTimer() {
  if (_reminderTimer) clearInterval(_reminderTimer);
  _reminderTimer = setInterval(checkRemindersTick, 60000); // tiap menit
  // Run immediate (skip first 5s untuk wait STATE)
  setTimeout(checkRemindersTick, 5000);
}
function checkRemindersTick() {
  const s = STATE.notifSettings;
  if (!s || !s.enabled) return;
  const me = STATE.currentMember;
  if (!me) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const currentTime = `${hh}:${mm}`;
  const today = todayStr();

  // 1. Daily reminder
  if (s.notifyDailyReminder && currentTime === s.reminderTime) {
    const lsKey = `team_tracker.lastDailyReminder.${me.id}`;
    if (localStorage.getItem(lsKey) !== today) {
      const unfinished = STATE.tasks.filter(t =>
        (t.assigneeId === me.id || t.isShared) &&
        t.status !== 'done' &&
        ((t.boardId || DEFAULT_BOARD_ID) === STATE.currentBoardId) &&
        ((t.date === today) || (t.date && t.date < today))
      );
      if (unfinished.length > 0) {
        showNotif(
          '📋 Reminder Tugas',
          `Kamu masih punya ${unfinished.length} tugas belum selesai hari ini`,
          {
            tag: `daily-${today}`,
            persist: true,
            type: 'daily',
            onClick: () => {
              STATE.currentView = 'kanban';
              renderMain();
            },
          }
        );
        playNotifSound();
      }
      localStorage.setItem(lsKey, today);
    }
  }

  // 2. Start time reminder
  // FIX v2.17: untuk task proyek, trigger di tiap hari range (today in [start..end])
  if (s.notifyOnStartTime) {
    const startingTasks = STATE.tasks.filter(t => {
      if (!(t.assigneeId === me.id || t.isShared)) return false;
      if (t.startTime !== currentTime) return false;
      if (t.status === 'done') return false;
      if (t.isDeleted === true) return false;
      if ((t.boardId || DEFAULT_BOARD_ID) !== STATE.currentBoardId) return false;
      if (t.isProject) {
        // Project: today harus dalam range [start..end]
        const start = t.date;
        const end = t.dueDate || t.date;
        return today >= start && today <= end;
      }
      return t.date === today;
    });
    for (const task of startingTasks) {
      const key = `team_tracker.lastStartNotif.${task.id}.${today}`;
      if (localStorage.getItem(key)) continue;
      const taskId = task.id;
      const titleSuffix = task.isProject ? ' (proyek)' : '';
      showNotif(
        '⏰ Waktunya Mulai!',
        `"${task.title}"${titleSuffix} — jadwal mulai jam ${task.startTime}`,
        {
          tag: `start-${task.id}`,
          type: 'start',
          onClick: () => openTaskModal(taskId),
        }
      );
      playNotifSound();
      localStorage.setItem(key, '1');
    }
  }
}

// Handle new task added via Firestore listener
function handleNewTaskNotif(taskDoc) {
  const s = STATE.notifSettings;
  if (!s || !s.enabled || !s.notifyOnNewTask) return;
  const me = STATE.currentMember;
  if (!me) return;
  const t = { id: taskDoc.id, ...taskDoc.data() };
  // Skip kalau ke-create oleh me sendiri
  if (t.createdById === me.id) return;
  // Skip kalau bukan ke me (kecuali shared OR admin)
  if (me.role !== 'admin' && t.assigneeId !== me.id && !t.isShared) return;
  // Skip task dari template auto-generate (avoid spam tiap pagi)
  if (t.fromTemplateId) return;
  // Skip task date sangat lampau
  const today = todayStr();
  if (t.date && t.date < today) return;

  const creator = t.createdByName || 'Seseorang';
  const forMe = t.assigneeId === me.id;
  let title;
  if (t.isShared) title = '👥 Tugas Bersama Baru';
  else if (forMe) title = '🆕 Tugas Baru untuk Kamu';
  else title = `🆕 Tugas Baru (${t.assigneeName || '?'})`;

  const taskId = t.id;
  showNotif(title, `${creator}: "${t.title}"`, {
    tag: `new-${t.id}`,
    type: 'new',
    onClick: () => openTaskModal(taskId),
  });
  playNotifSound();
}

// === Permission helpers ===
// Member cuma bisa edit/hapus task miliknya sendiri. Admin bisa ke semua.
// Tugas bersama (isShared) bisa diedit semua member (kolaboratif).
function canEditTask(task) {
  const me = STATE.currentMember;
  if (!me || !task) return false;
  if (me.role === 'admin') return true;
  if (task.isShared === true) return true;
  return task.assigneeId === me.id;
}
function canDeleteTask(task) {
  const me = STATE.currentMember;
  if (!me || !task) return false;
  return me.role === 'admin';
}
// Granular permission per member untuk Labels/Templates/Members
// Admin auto-true; member di-set oleh admin via Data Pengguna modal.
// permissions = { labels: bool, templates: bool, members: bool }
function hasPerm(perm) {
  const me = STATE.currentMember;
  if (!me) return false;
  if (me.role === 'admin') return true;
  return !!(me.permissions && me.permissions[perm]);
}

// === Progress ↔ Status mapping ===
// 0% = TODO, 1-99% = PROSES, 100% = DONE
function progressToStatus(p) {
  const n = Number(p) || 0;
  if (n >= 100) return 'done';
  if (n > 0) return 'proses';
  return 'todo';
}
function statusToProgress(s, currentProgress) {
  // Saat drag-drop antar kolom — set progress sesuai status tujuan.
  // Keep existing progress kalau sudah konsisten dengan status target.
  const cur = Number(currentProgress) || 0;
  if (s === 'done') return 100;
  if (s === 'todo') return 0;
  // proses: kalau current 0 atau 100, set ke 50 (default). Else keep.
  if (cur === 0 || cur === 100) return 50;
  return cur;
}
function progressFillClass(p) {
  const n = Number(p) || 0;
  if (n >= 100) return 'done';
  if (n > 0) return 'in-progress';
  return 'zero';
}

function toast(msg, type = '') {
  const root = document.getElementById('toast-root');

  el.className = `toast ${type ? 'toast-' + type : ''}`;

function showModal(html, opts = {}) {
  closeModal();
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal ${opts.size === 'lg' ? 'modal-lg' : ''}">${html}</div>`;
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay && !opts.persistent) closeModal();
  });
  root.appendChild(overlay);
  // Close button binding
  overlay.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', closeModal));
  // Focus first input
  setTimeout(() => {
    const first = overlay.querySelector('input,textarea,select');
    if (first) first.focus();
  }, 100);
  return overlay;
}
function closeModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
}

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

  const membersRef = collection(STATE.db, 'members');
  STATE.unsubMembers = onSnapshot(membersRef, (snap) => {
    STATE.members = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    // Refresh currentMember from latest data (role may change)
    if (STATE.currentMember) {
      const fresh = STATE.members.find(m => m.id === STATE.currentMember.id);
      if (fresh) {
        STATE.currentMember = fresh;
        localStorage.setItem(LS_KEYS.CURRENT_MEMBER, JSON.stringify(fresh));
      } else {

        localStorage.removeItem(LS_KEYS.CURRENT_MEMBER);
