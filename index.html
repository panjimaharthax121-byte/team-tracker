<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Tracker — ApotekKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* === APOTEKKU BRAND === */
    --bg: #faf7f3;           /* warm off-white (soft latte) */
    --bg-card: #ffffff;
    --bg-col: #f4f1ed;       /* sand */
    --bg-sidebar: #f7f3ee;
    --border: #e8e2da;
    --border-strong: #d4cdc1;
    --text: #1a1a1a;         /* ink */
    --text-muted: #5c5851;
    --text-light: #8b867d;
    --primary: #dc2626;      /* ApotekKu red */
    --primary-dark: #b91c1c;
    --primary-light: #fde8e8;
    --accent: #c87f1f;       /* warm amber (TaskPro-ish action) */
    --accent-light: #fdf4e7;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --info: #2563eb;
    --info-light: #dbeafe;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.10);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-lg: 18px;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, textarea, select { font-family: inherit; font-size: 14px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  h1, h2, h3, h4, .serif-heading { font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em; }

  /* === APP LAYOUT (sidebar + main) === */
  .app-shell {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    transition: transform .25s;
    z-index: 90;
  }
  .sidebar-brand {
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-logo {
    width: 36px; height: 36px;
    background: var(--primary);
    border-radius: var(--radius-sm);
    display: grid; place-items: center;
    color: white;
    box-shadow: 0 4px 12px rgba(220,38,38,0.25);
    flex-shrink: 0;
  }
  .sidebar-logo svg { width: 20px; height: 20px; }
  .sidebar-title {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .sidebar-nav {
    flex: 1;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .sidebar-nav-section {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    padding: 14px 12px 6px;
  }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    border: none;
    background: transparent;
    text-align: left;
    font-family: inherit;
    width: 100%;
  }
  .sidebar-nav-item:hover {
    background: rgba(0,0,0,0.04);
    color: var(--text);
  }
  .sidebar-nav-item.active {
    background: white;
    color: var(--text);
    font-weight: 600;
    box-shadow: var(--shadow-sm);
  }
  .sidebar-nav-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: 15px;
  }
  .sidebar-bottom {
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  .sidebar-logout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px 16px;
    background: var(--primary);
    color: white;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    transition: all .15s;
    font-family: inherit;
  }
  .sidebar-logout:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }

  /* === MAIN CONTENT === */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* === TOPBAR === */
  .topbar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-toggle {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    display: none;
    place-items: center;
    color: var(--text-muted);
    font-size: 20px;
  }
  .topbar-toggle:hover { background: var(--bg-col); }
  .topbar-welcome { flex: 1; }
  .topbar-welcome-title {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .topbar-welcome-sub {
    font-size: 13px;
    color: var(--text-muted);
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 4px;
    padding-right: 4px;
    background: transparent;
  }
  .user-badge-info {
    text-align: right;
    line-height: 1.3;
  }
  .user-badge-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
  }
  .user-badge-role {
    font-size: 11px;
    color: var(--text-muted);
  }
  .user-badge-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: white;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .admin-pill {
    background: var(--accent-light);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  /* === PAGE === */
  .page-content {
    padding: 28px 32px;
    flex: 1;
    overflow-y: auto;
  }
  .page-title-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 14px;
    flex-wrap: wrap;
  }
  .page-title {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .page-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* === FILTER STRIP === */
  .filter-strip {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-group-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-right: 4px;
  }
  .filter-divider {
    width: 1px;
    height: 22px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* === BUTTONS === */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid transparent;
    transition: all .15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { background: #a36418; }
  .btn-accent-soft {
    background: var(--accent-light);
    color: var(--accent);
    border-color: transparent;
  }
  .btn-accent-soft:hover { background: #fae8c9; }
  .btn-success { background: var(--success); color: white; }
  .btn-success:hover { background: #15803d; }
  .btn-success-soft {
    background: var(--success-light);
    color: #15803d;
  }
  .btn-success-soft:hover { background: #bbf7d0; }
  .btn-secondary { background: var(--bg-col); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { background: #e9e4dc; }
  .btn-ghost { background: transparent; color: var(--text-muted); }
  .btn-ghost:hover { background: var(--bg-col); color: var(--text); }
  .btn-ghost-soft {
    background: white;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost-soft:hover {
    background: var(--bg-col);
    color: var(--text);
  }
  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: var(--primary-dark); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-icon {
    width: 34px; height: 34px;
    padding: 0;
    border-radius: var(--radius-sm);
  }

  /* === FORMS === */
  .input, .select, .textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: white;
    font-size: 14px;
    transition: border-color .15s;
  }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--primary);
    outline-offset: 0;
  }
  .textarea { resize: vertical; min-height: 80px; font-family: inherit; }
  .label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .form-group { margin-bottom: 14px; }

  /* === FILTER CHIPS === */
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-col);
    color: var(--text-muted);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { background: #e1e7ef; }
  .chip.active {
    background: var(--primary);
    color: white;
  }
  .chip-avatar {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: white;
    font-size: 9px;
    font-weight: 700;
  }

  /* === DATE PICKER === */
  .date-control {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
  }
  .date-nav {
    width: 28px; height: 28px;
    border-radius: var(--radius-sm);
    display: grid; place-items: center;
    color: var(--text-muted);
  }
  .date-nav:hover { background: var(--bg-col); }
  .date-input {
    border: none;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
  }
  .date-today-btn {
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
  }
  .date-today-btn:hover { background: var(--primary-light); }

  /* === KANBAN === */
  .kanban {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    min-height: 400px;
  }
  .kanban-col {
    background: var(--bg-col);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 300px;
    transition: background .15s;
  }
  .kanban-col.drag-over {
    background: #dbeafe;
    outline: 2px dashed var(--primary);
    outline-offset: -2px;
  }
  .kanban-col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .kanban-col-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .kanban-col-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .col-todo .kanban-col-icon { background: var(--text-light); }
  .col-proses .kanban-col-icon { background: var(--warning); }
  .col-done .kanban-col-icon { background: var(--success); }
  .kanban-col-count {
    background: white;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .kanban-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .kanban-empty {
    text-align: center;
    color: var(--text-light);
    padding: 24px 12px;
    font-size: 12px;
    font-style: italic;
  }
  .kanban-add-btn {
    padding: 10px;
    border-radius: var(--radius);
    border: 1px dashed var(--border-strong);
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    margin-top: 4px;
    background: transparent;
  }
  .kanban-add-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: white;
  }

  /* === TASK CARD === */
  .task-card {
    background: white;
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    cursor: grab;
    transition: all .15s;
    position: relative;
  }
  .task-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .task-card.dragging {
    opacity: 0.5;
    cursor: grabbing;
  }
  .task-card.col-todo { border-left: 4px solid var(--info); }
  .task-card.col-proses { border-left: 4px solid var(--warning); }
  .task-card.col-done { border-left: 4px solid var(--success); }
  .task-card-body { cursor: pointer; }
  .task-card-actions {
    display: flex;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .task-card-actions .btn {
    flex: 1;
    padding: 8px 12px;
    font-size: 12.5px;
  }
  .task-card-history-btn {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    display: grid;
    place-items: center;
    font-size: 13px;
  }
  .task-card-history-btn:hover {
    background: var(--bg-col);
    color: var(--text);
  }
  .task-card.task-locked {
    background: #fafbfc;
    cursor: default;
  }
  .task-card.task-locked::after {
    content: '🔒';
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 11px;
    opacity: 0.45;
  }
  .task-card.task-locked:hover {
    transform: none;
    box-shadow: var(--shadow-sm);
  }
  .readonly-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    background: var(--bg-col);
    color: var(--text-muted);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
  }

  /* === BOARD SWITCHER === */
  .board-switcher {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .board-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-col);
    border: 1px solid transparent;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .board-chip:hover { background: #e1e7ef; }
  .board-chip.active {
    background: white;
    color: var(--text);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  .board-color {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .board-chip-new {
    border: 1px dashed var(--border-strong);
    background: transparent;
    font-size: 12px;
  }
  .board-chip-new:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  /* === LABEL CHIPS (di task card & modal) === */
  .label-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 600;
    color: white;
    line-height: 1.4;
  }
  .label-chip-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .label-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all .15s;
    background: var(--bg-col);
    color: var(--text);
    font-family: inherit;
  }
  .label-toggle.active {
    border-color: currentColor;
  }
  .label-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* === COLOR PICKER === */
  .color-picker {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .color-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1px var(--border);
    cursor: pointer;
    transition: transform .15s;
  }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active {
    box-shadow: 0 0 0 2px currentColor;
    transform: scale(1.05);
  }

  /* === CHECKLIST === */
  .checklist-block {
    background: var(--bg-col);
    padding: 12px 14px;
    border-radius: var(--radius);
    margin-bottom: 10px;
  }
  .checklist-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .checklist-title {
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    border: none;
    background: transparent;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .checklist-title:hover:not(:disabled) { background: rgba(0,0,0,0.04); }
  .checklist-title:focus { background: white; outline: 1px solid var(--primary); }
  .checklist-progress {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .checklist-progress-bar {
    height: 3px;
    background: white;
    border-radius: 100px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .checklist-progress-fill {
    height: 100%;
    background: var(--success);
    transition: width .25s;
  }
  .checklist-items { display: flex; flex-direction: column; gap: 4px; }
  .checklist-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px;
    border-radius: 4px;
  }
  .checklist-item:hover { background: rgba(0,0,0,0.03); }
  .checklist-item input[type="checkbox"] {
    width: 16px; height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
  }
  .checklist-item-text {
    flex: 1;
    border: none;
    background: transparent;
    padding: 4px;
    font-size: 13px;
    border-radius: 4px;
  }
  .checklist-item-text:hover:not(:disabled) { background: rgba(0,0,0,0.04); }
  .checklist-item-text:focus { background: white; outline: 1px solid var(--primary); }

/* =============================================================

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function dateLabel(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const today = todayStr();
  const yest = (() => { const t = new Date(); t.setDate(t.getDate() - 1); return [t.getFullYear(), String(t.getMonth()+1).padStart(2,'0'), String(t.getDate()).padStart(2,'0')].join('-'); })();
  if (dateStr === today) return 'Hari ini';
  if (dateStr === yest) return 'Kemarin';
  return dt.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });

function shiftDate(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

  if (!date) return '';
  const d = date instanceof Date ? date : (date.toDate ? date.toDate() : new Date(date));
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (sec < 60) return 'baru saja';
  if (sec < 3600) return `${Math.floor(sec / 60)}m lalu`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}j lalu`;
  if (sec < 604800) return `${Math.floor(sec / 86400)}h lalu`;
  return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
}
function colorFor(name) {
  const s = String(name || '');
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) {
  const parts = String(name || '?').trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function avatarHtml(name, sizeClass = '') {
  return `<span class="avatar ${sizeClass}" style="background:${colorFor(name)}">${escapeHtml(initials(name))}</span>`;
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// === Permission helpers ===
// Member cuma bisa edit/hapus task miliknya sendiri. Admin bisa ke semua.
function canEditTask(task) {
  const me = STATE.currentMember;
  if (!me || !task) return false;
  if (me.role === 'admin') return true;
  return task.assigneeId === me.id;
}
function canDeleteTask(task) {

  if (!me || !task) return false;
  return me.role === 'admin';
}

// === Progress ↔ Status mapping ===
// 0% = TODO, 1-99% = PROSES, 100% = DONE
function progressToStatus(p) {
  const n = Number(p) || 0;
  if (n >= 100) return 'done';
  if (n > 0) return 'proses';
  return 'todo';
}
function statusToProgress(s, currentProgress) {
  // Saat drag-drop antar kolom — set progress sesuai status tujuan.
  // Keep existing progress kalau sudah konsisten dengan status target.
  const cur = Number(currentProgress) || 0;
  if (s === 'done') return 100;
  if (s === 'todo') return 0;
  // proses: kalau current 0 atau 100, set ke 50 (default). Else keep.
  if (cur === 0 || cur === 100) return 50;
  return cur;
}
function progressFillClass(p) {
  const n = Number(p) || 0;
  if (n >= 100) return 'done';
  if (n > 0) return 'in-progress';
  return 'zero';
}

/* =============================================================

   ============================================================= */
function toast(msg, type = '') {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type ? 'toast-' + type : ''}`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

   MODAL
   ============================================================= */
function showModal(html, opts = {}) {
  closeModal();
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal ${opts.size === 'lg' ? 'modal-lg' : ''}">${html}</div>`;
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay && !opts.persistent) closeModal();
  });
  root.appendChild(overlay);
  // Close button binding
  overlay.querySelectorAll('[data-close-modal]').forEach(b => b.addEventListener('click', closeModal));
  // Focus first input
  setTimeout(() => {
    const first = overlay.querySelector('input,textarea,select');
    if (first) first.focus();
  }, 100);
  return overlay;
}
function closeModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

/* =============================================================
   FIREBASE INIT
   ============================================================= */
function getStoredConfig() {
  try { return JSON.parse(localStorage.getItem(LS_KEYS.FB_CONFIG) || 'null'); }
  catch { return null; }
}
function saveConfig(cfg) {
  localStorage.setItem(LS_KEYS.FB_CONFIG, JSON.stringify(cfg));
}

async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function isAuthValid() {
  const ts = parseInt(localStorage.getItem(LS_KEYS.AUTHED_AT) || '0', 10);
  if (!ts) return false;
  const ageMs = Date.now() - ts;
  return ageMs < AUTH_TTL_DAYS * 24 * 60 * 60 * 1000;
}

async function bootstrap() {
  if (!isAuthValid()) {
    renderPasswordGate();
    return;
  }
  const cfg = EMBEDDED_CONFIG || getStoredConfig();
  if (!cfg) {
    renderSetupWizard();
    return;
  }
  try {
    const app = initializeApp(cfg);
    STATE.auth = getAuth(app);
    STATE.db = getFirestore(app);
    await signInAnonymously(STATE.auth);
    onAuthStateChanged(STATE.auth, (user) => {
      if (user) {
        STATE.user = user;
        afterAuth();
      }
    });
  } catch (err) {
    console.error('Firebase init error', err);
    document.getElementById('app').innerHTML = `
      <div class="setup-shell"><div class="setup-card">
        <h1>Config Firebase salah</h1>
        <p>Error: ${escapeHtml(err.message)}</p>
        <button class="btn btn-primary" onclick="localStorage.removeItem('${LS_KEYS.FB_CONFIG}'); location.reload();">Reset & Setup Ulang</button>
      </div></div>`;
  }
}

async function afterAuth() {
  // Load current member & current board from localStorage
  const storedMember = localStorage.getItem(LS_KEYS.CURRENT_MEMBER);
  if (storedMember) {
    try { STATE.currentMember = JSON.parse(storedMember); } catch {}
  }
  STATE.currentBoardId = localStorage.getItem(LS_KEYS.CURRENT_BOARD_ID) || DEFAULT_BOARD_ID;

  // Subscribe members; subscribeBoards akan dipanggil setelah members ready
  subscribeMembers();
}

function subscribeMembers() {
  const membersRef = collection(STATE.db, 'members');
  STATE.unsubMembers = onSnapshot(membersRef, (snap) => {
    STATE.members = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    // Refresh currentMember from latest data (role may change)
    if (STATE.currentMember) {
      const fresh = STATE.members.find(m => m.id === STATE.currentMember.id);
      if (fresh) {
        STATE.currentMember = fresh;
        localStorage.setItem(LS_KEYS.CURRENT_MEMBER, JSON.stringify(fresh));
      } else {
        // Member deleted, force re-login
        STATE.currentMember = null;
        localStorage.removeItem(LS_KEYS.CURRENT_MEMBER);
      }
    }

    // Decision tree
    if (STATE.members.length === 0) {
      renderFirstAdminSetup();
    } else if (!STATE.currentMember) {
      renderMemberPicker();
    } else {
      // Trigger boards subscription (yang akan trigger labels/templates/tasks)
      if (!STATE.unsubBoards) subscribeBoards();
      // Kalau boards sudah ready, langsung render
      if (STATE.boards.length > 0) renderMain();
    }
  }, (err) => {
    console.error('Members listener error', err);
    toast('Gagal load anggota: ' + err.message, 'error');
  });
}

async function subscribeBoards() {
  const boardsRef = collection(STATE.db, 'boards');
  STATE.unsubBoards = onSnapshot(boardsRef, async (snap) => {
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    STATE.boards = all
      .filter(b => !b.archived)
      .sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));

    // Auto-create default board kalau belum ada
    if (all.length === 0 && STATE.currentMember) {
      try {
        await setDoc(doc(STATE.db, 'boards', DEFAULT_BOARD_ID), {
          name: DEFAULT_BOARD_NAME,
          color: PALETTE[0].value,
          createdById: STATE.currentMember.id,
          createdByName: STATE.currentMember.name,
          createdAt: serverTimestamp(),
          archived: false,
        });
        return; // Listener fires lagi
      } catch (err) {
        console.error('Gagal bikin default board', err);
        toast('Gagal bikin default board: ' + err.message, 'error');
      }
    }

    // Pastikan currentBoardId valid
    if (STATE.boards.length > 0 && !STATE.boards.find(b => b.id === STATE.currentBoardId)) {
      STATE.currentBoardId = STATE.boards[0].id;
      localStorage.setItem(LS_KEYS.CURRENT_BOARD_ID, STATE.currentBoardId);
    }

    // Subscribe ke labels & templates untuk board aktif
    subscribeLabels();
    subscribeTemplates();
    subscribeTasks();

    // Re-render
    if (STATE.currentMember && STATE.boards.length > 0) renderMain();
  }, (err) => {
    console.error('Boards listener error', err);
    toast('Gagal load boards: ' + err.message, 'error');
  });
}

function subscribeLabels() {
  if (STATE.unsubLabels) { STATE.unsubLabels(); STATE.unsubLabels = null; }
  if (!STATE.currentBoardId) return;
  const labelsRef = collection(STATE.db, 'boards', STATE.currentBoardId, 'labels');
  STATE.unsubLabels = onSnapshot(labelsRef, (snap) => {
    STATE.labels = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    renderKanban();
  }, (err) => console.error('Labels listener error', err));
}

function subscribeTemplates() {
  if (STATE.unsubTemplates) { STATE.unsubTemplates(); STATE.unsubTemplates = null; }
  if (!STATE.currentBoardId) return;
  const tplRef = collection(STATE.db, 'boards', STATE.currentBoardId, 'templates');
  STATE.unsubTemplates = onSnapshot(tplRef, (snap) => {
    STATE.templates = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
  }, (err) => console.error('Templates listener error', err));
}

function switchBoard(boardId) {
  if (!boardId || boardId === STATE.currentBoardId) return;
  STATE.currentBoardId = boardId;
  localStorage.setItem(LS_KEYS.CURRENT_BOARD_ID, boardId);
  STATE.filterLabelIds = []; // reset label filter
  subscribeLabels();
  subscribeTemplates();
  // subscribeTasks tetap (query by date sama), filtering by board client-side
  renderMain();
}

// Helper — task yang visible di board aktif
function visibleTasks() {
  return STATE.tasks.filter(t => (t.boardId || DEFAULT_BOARD_ID) === STATE.currentBoardId);
}

function subscribeTasks() {
  if (STATE.unsubTasks) STATE.unsubTasks();
  const tasksRef = collection(STATE.db, 'tasks');
  const q = query(tasksRef, where('date', '==', STATE.selectedDate));
  STATE.unsubTasks = onSnapshot(q, (snap) => {
    STATE.tasks = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => {
        const ta = a.createdAt?.toMillis?.() || 0;
        const tb = b.createdAt?.toMillis?.() || 0;
        return ta - tb;
      });
    renderKanban();
  }, (err) => {
    console.error('Tasks listener error', err);
    toast('Gagal load tugas: ' + err.message, 'error');
  });
}

          Lupa password? Hubungi admin tim.
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById('pw-input');
  const submit = document.getElementById('pw-submit');
  const remember = document.getElementById('pw-remember');
  const errEl = document.getElementById('pw-error');

  async function tryAuth() {
    const pw = input.value.trim();
    if (!pw) { errEl.textContent = 'Password kosong'; return; }
    submit.disabled = true;
    submit.innerHTML = '<span class="loader"></span>';
    const hash = await sha256Hex(pw);
    if (hash === PASSWORD_HASH) {
      if (remember.checked) {
        localStorage.setItem(LS_KEYS.AUTHED_AT, String(Date.now()));
      } else {
        sessionStorage.setItem(LS_KEYS.AUTHED_AT, String(Date.now()));
        localStorage.setItem(LS_KEYS.AUTHED_AT, String(Date.now() - (AUTH_TTL_DAYS - 0.5) * 86400000));
      }
      bootstrap();
    } else {
      submit.disabled = false;
      submit.textContent = 'Masuk →';
      errEl.textContent = 'Password salah';
      input.value = '';
      input.focus();
    }
  }
  submit.addEventListener('click', tryAuth);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryAuth(); });
  input.focus();
}

    const raw = document.getElementById('setup-config-input').value.trim();
    if (!raw) { toast('Paste config dulu', 'error'); return; }
    try {
      let configRaw = raw;
      // Extract firebaseConfig object kalau user paste full snippet
      // (matches: `const firebaseConfig = {...}`, `var firebaseConfig = {...}`, `firebaseConfig: {...}`)
      const objMatch = raw.match(/firebaseConfig\s*[:=]\s*(\{[\s\S]*?\n\s*\})/);
      if (objMatch) {
        configRaw = objMatch[1];
      } else {
        // Fallback: kalau ada `{` ... `}` yang mengandung apiKey, ambil itu
        const braceMatch = raw.match(/\{[\s\S]*?apiKey[\s\S]*?\}/);
        if (braceMatch && !raw.trim().startsWith('{')) {
          configRaw = braceMatch[0];
        }
      }
      let cfg;
      try {
        cfg = JSON.parse(configRaw);
      } catch {
        // JS object literal (unquoted keys, single quotes, dll)

        return;

      saveConfig(cfg);
      toast('Config tersimpan, memuat...', 'success');
      setTimeout(() => location.reload(), 600);
    } catch (err) {
      toast('Format config salah: ' + err.message, 'error');
    }
  });
}

      if (idx === -1) STATE.filterLabelIds.push(id);
      else STATE.filterLabelIds.splice(idx, 1);

  const sidebar = document.getElementById('sidebar');

  if (toggle) toggle.addEventListener('click', () => {
    sidebar?.classList.toggle('open');
    overlay?.classList.toggle('show');
  });
  if (overlay) overlay.addEventListener('click', closeSidebarMobile);
  function closeSidebarMobile() {
    sidebar?.classList.remove('open');
    overlay?.classList.remove('show');
  }

  renderKanban();
}

/* =============================================================
   KANBAN
   ============================================================= */
function renderKanban() {
  const root = document.getElementById('kanban-root');
  if (!root) return;

  let filtered = visibleTasks();
  if (STATE.filterMemberId) filtered = filtered.filter(t => t.assigneeId === STATE.filterMemberId);
  if (STATE.filterLabelIds.length > 0) {
    filtered = filtered.filter(t =>
      (t.labelIds || []).some(lid => STATE.filterLabelIds.includes(lid))
    );
  }

  const cols = [
    { key: 'todo', label: 'Todo', icon: '○' },
    { key: 'proses', label: 'Proses', icon: '◐' },
    { key: 'done', label: 'Done', icon: '●' },
  ];

  const colsHtml = cols.map(c => {
    const tasksInCol = filtered.filter(t => (t.status || 'todo') === c.key);
    const cards = tasksInCol.map(t => renderTaskCard(t)).join('');
    return `
      <div class="kanban-col col-${c.key}" data-col="${c.key}">
        <div class="kanban-col-header">
          <div class="kanban-col-title">
            <span class="kanban-col-icon"></span>
            ${c.label}
          </div>
          <span class="kanban-col-count">${tasksInCol.length}</span>
        </div>
        <div class="kanban-list">
          ${cards || `<div class="kanban-empty">Kosong</div>`}
        </div>
        <button class="kanban-add-btn" data-add-status="${c.key}">+ Tambah</button>
      </div>
    `;
  }).join('');

  root.innerHTML = `<div class="kanban">${colsHtml}</div>`;

  // Bind card click (only on body, not on action buttons)
  root.querySelectorAll('[data-task-id]').forEach(el => {
    const body = el.querySelector('[data-card-body]');
    if (body) {
      body.addEventListener('click', (e) => {
        if (e.target.closest('[data-stop]')) return;
        openTaskModal(el.dataset.taskId);
      });
    }
  });

  // Quick action buttons (Kerjakan / Batal / Selesai / Batal Selesai)
  root.querySelectorAll('[data-quick-action]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const [newStatus, taskId] = btn.dataset.quickAction.split(':');
      const task = STATE.tasks.find(t => t.id === taskId);
      if (!task || !canEditTask(task)) return;
      await updateTaskStatus(taskId, newStatus);
    });
  });

  // History button → modal Riwayat Pengerjaan
  root.querySelectorAll('[data-history]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openHistoryModal(btn.dataset.history);
    });
  });

  // Drag-drop — hanya enable untuk task yg user bisa edit
  root.querySelectorAll('[data-task-id]').forEach(card => {
    const taskId = card.dataset.taskId;
    const task = STATE.tasks.find(t => t.id === taskId);
    if (!canEditTask(task)) {
      card.draggable = false;
      return;
    }
    card.draggable = true;
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', taskId);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  root.querySelectorAll('.kanban-col').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.col;
      const task = STATE.tasks.find(t => t.id === taskId);
      if (!task || task.status === newStatus) return;
      if (!canEditTask(task)) {
        toast('Kamu cuma bisa ubah status task kamu sendiri', 'error');
        return;
      }
      await updateTaskStatus(taskId, newStatus);
    });
  });

  // Add buttons — preset progress sesuai kolom
  root.querySelectorAll('[data-add-status]').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.addStatus;
      const progress = s === 'done' ? 100 : (s === 'proses' ? 50 : 0);
      openTaskModal(null, { progress });
    });
  });
}

function renderTaskCard(t) {
  const assignee = STATE.members.find(m => m.id === t.assigneeId);
  const assigneeName = assignee?.name || t.assigneeName || '?';
  const commentCount = (t.comments || []).length;
  const desc = t.description ? `<div class="task-card-desc">${escapeHtml(t.description)}</div>` : '';
  const locked = !canEditTask(t);
  const progress = Number(t.progress) || 0;
  const fillClass = progressFillClass(progress);
  const status = t.status || 'todo';

  // Labels
  const taskLabels = (t.labelIds || [])
    .map(id => STATE.labels.find(l => l.id === id))
    .filter(Boolean);
  const labelsHtml = taskLabels.length > 0 ? `
    <div class="label-chip-row">
      ${taskLabels.map(l => `<span class="label-chip" style="background:${l.color}">${escapeHtml(l.name)}</span>`).join('')}
    </div>
  ` : '';

  // Due date badge
  const dueBadge = renderDueBadge(t);

  // Checklist progress
  const checklistInfo = computeChecklistTotal(t);
  const checklistBadge = checklistInfo.total > 0
    ? `<span title="${checklistInfo.done} dari ${checklistInfo.total} checklist selesai">☑️ ${checklistInfo.done}/${checklistInfo.total}</span>`
    : '';

  // Action buttons (conditional by status & permission)
  let actionsHtml = '';
  if (!locked) {
    if (status === 'todo') {
      actionsHtml = `
        <button class="btn btn-accent" data-stop data-quick-action="proses:${t.id}">
          Kerjakan →
        </button>
      `;
    } else if (status === 'proses') {
      actionsHtml = `
        <button class="btn btn-ghost-soft" data-stop data-quick-action="todo:${t.id}">
          ↺ Batal
        </button>
        <button class="btn btn-success" data-stop data-quick-action="done:${t.id}">
          ✓ Selesai
        </button>
      `;
    } else if (status === 'done') {
      actionsHtml = `
        <button class="btn btn-ghost-soft" data-stop data-quick-action="proses:${t.id}">
          ↺ Batal Selesai
        </button>
      `;
    }
  }

  return `
    <div class="task-card col-${status} ${locked ? 'task-locked' : ''}" data-task-id="${t.id}">
      <div class="task-card-body" data-card-body>
        ${labelsHtml}
        <div class="task-card-title">${escapeHtml(t.title)}</div>
        ${desc}
        <div class="task-card-progress">
          <div class="task-card-progress-track">
            <div class="task-card-progress-fill ${fillClass}" style="width:${progress}%"></div>
          </div>
          <span class="task-card-progress-label">${progress}%</span>
        </div>
        <div class="task-card-meta">
          <span class="task-card-assignee">
            ${avatarHtml(assigneeName)} ${escapeHtml(assigneeName)}
          </span>
          ${dueBadge}
          ${checklistBadge}
          ${commentCount ? `<span class="task-card-comments-badge">💬 ${commentCount}</span>` : ''}
          <button class="task-card-history-btn" data-stop data-history="${t.id}" title="Riwayat Pengerjaan">🕐</button>
        </div>
      </div>
      ${actionsHtml ? `<div class="task-card-actions">${actionsHtml}</div>` : ''}
    </div>
  `;
}

function computeChecklistTotal(task) {
  let done = 0, total = 0;
  (task.checklists || []).forEach(cl => {
    (cl.items || []).forEach(it => { total++; if (it.done) done++; });
  });
  return { done, total };
}

function renderDueBadge(task) {
  if (!task.dueDate) return '';
  const today = todayStr();
  const cls = task.status === 'done'
    ? 'done'
    : (task.dueDate < today ? 'overdue' : (task.dueDate === today ? 'today' : 'soon'));
  // Format human-readable
  const [y, m, d] = task.dueDate.split('-');
  const label = `${d}/${m}`;
  return `<span class="due-badge ${cls}" title="Deadline: ${task.dueDate}">📅 ${label}</span>`;
}

/* =============================================================
   TASK CRUD
   ============================================================= */
function openTaskModal(taskId = null, presets = {}) {
  const task = taskId ? STATE.tasks.find(t => t.id === taskId) : null;
  const isEdit = !!task;
  const me = STATE.currentMember;
  const isAdmin = me.role === 'admin';

  // Permission: kalau lagi edit & member tidak punya task → read-only mode
  const canEdit = isEdit ? canEditTask(task) : true;
  const canDelete = isEdit ? canDeleteTask(task) : false;
  const readOnly = isEdit && !canEdit;

  // Default assignee: me (kalau create), atau dari task (kalau edit)
  const defaultAssigneeId = task?.assigneeId || me.id;

  // Apply preset values
  const initialTitle = task?.title ?? presets.title ?? '';
  const initialDesc = task?.description ?? presets.description ?? '';
  const initialChecklists = task?.checklists ?? presets.checklists ?? [];
  const initialLabelIds = task?.labelIds ?? presets.labelIds ?? [];
  const initialDueDate = task?.dueDate ?? presets.dueDate ?? '';

  const memberOpts = STATE.members.map(m =>
    `<option value="${m.id}" ${m.id === defaultAssigneeId ? 'selected' : ''}>${escapeHtml(m.name)}${m.role === 'admin' ? ' (admin)' : ''}</option>`
  ).join('');

  // Non-admin can only assign to self (saat create); read-only dipakai untuk edit task orang lain
  const canChangeAssignee = isAdmin && !readOnly;
  const disabledAttr = readOnly ? 'disabled' : '';

  // Template picker — kalau create mode & ada template di board
  const templatePicker = !isEdit && STATE.templates.length > 0 ? `
    <div class="form-group">
      <label class="label">Pakai Template (opsional)</label>
      <select id="t-template" class="select">
        <option value="">— Tanpa template —</option>
        ${STATE.templates.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
      </select>
    </div>
  ` : '';

  // Labels section
  const labelsSection = STATE.labels.length > 0 ? `
    <div class="form-group">
      <label class="label">Label</label>
      <div class="chip-row" id="t-labels-row">
        ${STATE.labels.map(l => `
          <button type="button" class="label-toggle ${initialLabelIds.includes(l.id) ? 'active' : ''}"
            data-toggle-label="${l.id}" style="color:${l.color}" ${disabledAttr}>
            <span class="label-dot" style="background:${l.color}"></span>
            ${escapeHtml(l.name)}
          </button>
        `).join('')}
      </div>
    </div>
  ` : '';

  // Checklists section
  const checklistsSection = `
    <div class="form-group">
      <label class="label">Checklist</label>
      <div id="t-checklists-root">${renderChecklistsEditor(initialChecklists, readOnly)}</div>
      ${readOnly ? '' : `<button type="button" class="btn btn-secondary btn-sm" id="t-add-checklist" style="margin-top:6px">+ Tambah Checklist Baru</button>`}
    </div>
  `;

  const html = `
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div class="modal-title">
          ${isEdit ? (readOnly ? '👁️ Lihat Tugas' : 'Edit Tugas') : 'Tugas Baru'}
        </div>
        ${readOnly ? `<span class="readonly-badge">🔒 Read-only — bukan task kamu</span>` : ''}
      </div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      ${templatePicker}
      <div class="form-group">
        <label class="label">Judul Tugas</label>
        <input id="t-title" class="input" placeholder="Mis: Bikin laporan B2C minggu ini" value="${escapeHtml(initialTitle)}" autocomplete="off" ${disabledAttr}>
      </div>
      ${labelsSection}
      <div class="form-group">
        <label class="label">Deskripsi (opsional)</label>
        <textarea id="t-desc" class="textarea" placeholder="Detail tugas..." ${disabledAttr}>${escapeHtml(initialDesc)}</textarea>
      </div>
      <div class="form-group">
        ${renderProgressControl(task?.progress ?? presets.progress ?? 0, readOnly)}
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group">
          <label class="label">Pelaksana</label>
          <select id="t-assignee" class="select" ${canChangeAssignee ? '' : 'disabled'}>${memberOpts}</select>
        </div>
        <div class="form-group">
          <label class="label">Tanggal Aktif</label>
          <input type="date" id="t-date" class="input" value="${task?.date || STATE.selectedDate}" ${disabledAttr}>
        </div>
      </div>

      <div class="form-group">
        <label class="label">Deadline (opsional)</label>
        <input type="date" id="t-due" class="input" value="${initialDueDate}" ${disabledAttr}>
      </div>

      ${checklistsSection}

      ${isEdit ? renderTaskMetaInfo(task) : ''}
      ${isEdit ? renderActivitySection(task) : ''}
      ${isEdit ? renderCommentsSection(task) : ''}
    </div>
    <div class="modal-footer">
      ${isEdit && canDelete ? `<button class="btn btn-danger" id="t-delete" style="margin-right:auto">Hapus</button>` : ''}
      <button class="btn btn-ghost" data-close-modal>${readOnly ? 'Tutup' : 'Batal'}</button>
      ${readOnly ? '' : `<button class="btn btn-primary" id="t-save">${isEdit ? 'Simpan' : 'Buat Tugas'}</button>`}
    </div>
  `;

  showModal(html, { size: 'lg' });

  // Read-only mode: no save handler, tetap bisa comment
  if (readOnly) {
    if (isEdit) bindCommentForm(task);
    if (isEdit) bindCommentDelete(task);
    return;
  }

  // Bind progress slider — update label/status hint/quick btn active live
  bindProgressControl();

  // Mutable state untuk modal (labels & checklists)
  const MODAL_STATE = {
    labelIds: [...initialLabelIds],
    checklists: JSON.parse(JSON.stringify(initialChecklists)),
  };

  bindLabelToggles(MODAL_STATE);
  bindChecklistEditor(MODAL_STATE, readOnly);
  bindTemplatePicker();

  document.getElementById('t-save').addEventListener('click', async () => {
    const title = document.getElementById('t-title').value.trim();
    const desc = document.getElementById('t-desc').value.trim();
    const progress = Number(document.getElementById('t-progress').value) || 0;
    let status = progressToStatus(progress);
    const assigneeId = document.getElementById('t-assignee').value;
    const date = document.getElementById('t-date').value;
    const dueDate = document.getElementById('t-due').value || null;
    if (!title) { toast('Judul wajib diisi', 'error'); return; }
    if (!date) { toast('Tanggal wajib diisi', 'error'); return; }
    const assignee = STATE.members.find(m => m.id === assigneeId);
    if (!assignee) { toast('Pelaksana tidak valid', 'error'); return; }

    // Auto-sync progress kalau ada checklist
    const cInfo = computeChecklistTotalArr(MODAL_STATE.checklists);
    let finalProgress = progress;
    if (cInfo.total > 0 && (cInfo.done === cInfo.total) && progress < 100) {
      // Semua checklist done → set progress 100 kalau user belum naikin
      finalProgress = 100;
      status = 'done';
    }

    try {
      if (isEdit) {
        const update = {
          title, description: desc, status, progress: finalProgress, date, dueDate,
          assigneeId, assigneeName: assignee.name,
          labelIds: MODAL_STATE.labelIds,
          checklists: MODAL_STATE.checklists,
          updatedAt: serverTimestamp(),
        };
        // Activity log
        const activity = task.activity || [];
        const newActivities = diffActivities(task, update, me);
        if (newActivities.length > 0) update.activity = [...activity, ...newActivities];
        if (status === 'done' && task.status !== 'done') update.completedAt = serverTimestamp();
        if (status !== 'done' && task.status === 'done') update.completedAt = null;
        await updateDoc(doc(STATE.db, 'tasks', task.id), update);
        toast('Tugas tersimpan', 'success');
      } else {
        await addDoc(collection(STATE.db, 'tasks'), {
          title, description: desc, status, progress: finalProgress, date, dueDate,
          assigneeId, assigneeName: assignee.name,
          boardId: STATE.currentBoardId,
          labelIds: MODAL_STATE.labelIds,
          checklists: MODAL_STATE.checklists,
          createdById: me.id, createdByName: me.name,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          completedAt: status === 'done' ? serverTimestamp() : null,
          comments: [],
          activity: [{
            id: uid(), type: 'created', byId: me.id, byName: me.name,
            at: new Date().toISOString(),
          }],
        });
        toast('Tugas dibuat', 'success');
      }
      closeModal();
    } catch (err) {
      toast('Gagal simpan: ' + err.message, 'error');
    }
  });

  if (isEdit) {
    const delBtn = document.getElementById('t-delete');
    if (delBtn) {
      delBtn.addEventListener('click', async () => {
        if (!confirm(`Hapus tugas "${task.title}"?`)) return;
        try {
          await deleteDoc(doc(STATE.db, 'tasks', task.id));
          toast('Tugas dihapus', 'success');
          closeModal();
        } catch (err) {
          toast('Gagal hapus: ' + err.message, 'error');
        }
      });
    }

    // Comment form binding
    bindCommentForm(task);
    bindCommentDelete(task);
  }
}

// === Checklist helpers ===
function computeChecklistTotalArr(checklists) {
  let done = 0, total = 0;
  (checklists || []).forEach(cl => {
    (cl.items || []).forEach(it => { total++; if (it.done) done++; });
  });
  return { done, total };
}

function renderChecklistsEditor(checklists, readOnly) {
  if (!checklists || checklists.length === 0) {
    return readOnly
      ? '<div style="font-size:12px;color:var(--text-light);text-align:center;padding:8px">Tidak ada checklist</div>'
      : '';
  }
  return checklists.map((cl, ci) => {
    const items = cl.items || [];
    const done = items.filter(i => i.done).length;
    const total = items.length;
    const pct = total > 0 ? Math.round(done * 100 / total) : 0;
    return `
      <div class="checklist-block" data-cl-idx="${ci}">
        <div class="checklist-head">
          <input class="checklist-title" data-cl-title="${ci}" value="${escapeHtml(cl.title || '')}" placeholder="Judul checklist..." ${readOnly ? 'disabled' : ''}>
          <span class="checklist-progress">${done}/${total}</span>
          ${readOnly ? '' : `<button type="button" class="btn btn-ghost btn-sm" data-del-cl="${ci}" style="color:var(--danger)">✕</button>`}
        </div>
        <div class="checklist-progress-bar">
          <div class="checklist-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="checklist-items">
          ${items.map((it, ii) => `
            <div class="checklist-item">
              <input type="checkbox" data-toggle-item="${ci}.${ii}" ${it.done ? 'checked' : ''} ${readOnly ? 'disabled' : ''}>
              <input class="checklist-item-text ${it.done ? 'checked' : ''}" data-item-text="${ci}.${ii}" value="${escapeHtml(it.text || '')}" placeholder="Item..." ${readOnly ? 'disabled' : ''}>
              ${readOnly ? '' : `<button type="button" class="checklist-item-delete" data-del-item="${ci}.${ii}">✕</button>`}
            </div>
          `).join('')}
        </div>
        ${readOnly ? '' : `<button type="button" class="checklist-add-btn" data-add-item="${ci}">+ Tambah Item</button>`}
      </div>
    `;
  }).join('');
}

function bindChecklistEditor(state, readOnly) {
  const root = document.getElementById('t-checklists-root');
  const addBtn = document.getElementById('t-add-checklist');
  if (!root) return;

  function refresh() {
    root.innerHTML = renderChecklistsEditor(state.checklists, readOnly);
    attachListeners();
  }

  function attachListeners() {
    if (readOnly) return;
    // Toggle item done
    root.querySelectorAll('[data-toggle-item]').forEach(cb => {
      cb.addEventListener('change', () => {
        const [ci, ii] = cb.dataset.toggleItem.split('.').map(Number);
        state.checklists[ci].items[ii].done = cb.checked;
        refresh();
      });
    });
    // Edit item text
    root.querySelectorAll('[data-item-text]').forEach(input => {
      input.addEventListener('input', () => {
        const [ci, ii] = input.dataset.itemText.split('.').map(Number);
        state.checklists[ci].items[ii].text = input.value;
      });
    });
    // Edit checklist title
    root.querySelectorAll('[data-cl-title]').forEach(input => {
      input.addEventListener('input', () => {
        const ci = Number(input.dataset.clTitle);
        state.checklists[ci].title = input.value;
      });
    });
    // Delete checklist
    root.querySelectorAll('[data-del-cl]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ci = Number(btn.dataset.delCl);
        if (!confirm('Hapus checklist ini?')) return;
        state.checklists.splice(ci, 1);
        refresh();
      });
    });
    // Delete item
    root.querySelectorAll('[data-del-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [ci, ii] = btn.dataset.delItem.split('.').map(Number);
        state.checklists[ci].items.splice(ii, 1);
        refresh();
      });
    });
    // Add item
    root.querySelectorAll('[data-add-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ci = Number(btn.dataset.addItem);
        state.checklists[ci].items.push({ id: uid(), text: '', done: false });
        refresh();
        // Focus the new item input
        setTimeout(() => {
          const inputs = root.querySelectorAll(`[data-cl-idx="${ci}"] [data-item-text]`);
          if (inputs.length) inputs[inputs.length - 1].focus();
        }, 50);
      });
    });
  }

  if (addBtn) {
    addBtn.addEventListener('click', () => {
      state.checklists.push({ id: uid(), title: 'Checklist', items: [] });
      refresh();
    });
  }
  attachListeners();
}

function bindLabelToggles(state) {
  document.querySelectorAll('[data-toggle-label]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const id = btn.dataset.toggleLabel;
      const idx = state.labelIds.indexOf(id);
      if (idx === -1) {
        state.labelIds.push(id);
        btn.classList.add('active');
      } else {
        state.labelIds.splice(idx, 1);
        btn.classList.remove('active');
      }
    });
  });
}

function bindTemplatePicker() {
  const sel = document.getElementById('t-template');
  if (!sel) return;
  sel.addEventListener('change', () => {
    const id = sel.value;
    if (!id) return;
    const tpl = STATE.templates.find(t => t.id === id);
    if (!tpl) return;
    // Fill title if empty
    const titleEl = document.getElementById('t-title');
    if (titleEl && !titleEl.value.trim() && tpl.title) titleEl.value = tpl.title;
    // Fill description if empty
    const descEl = document.getElementById('t-desc');
    if (descEl && !descEl.value.trim() && tpl.description) descEl.value = tpl.description;
    // Add checklist from template (only if no existing checklist)
    const checklistRoot = document.getElementById('t-checklists-root');
    if (checklistRoot && (tpl.checklists || []).length > 0 && checklistRoot.innerHTML.trim() === '') {
      // We need access to MODAL_STATE — re-trigger via custom event
      const ev = new CustomEvent('template-applied', { detail: { template: tpl } });
      document.dispatchEvent(ev);
    }
    toast(`Template "${tpl.name}" diterapkan`, 'success');
  });
  // Listen for template-applied event (binds inside bindChecklistEditor scope)
}

// === Activity helpers ===
function diffActivities(oldTask, newTask, me) {
  const news = [];
  const ts = new Date().toISOString();
  const oldP = Number(oldTask.progress) || 0;
  const newP = Number(newTask.progress) || 0;
  if (oldP !== newP) {
    news.push({
      id: uid(), type: 'progress_changed',
      byId: me.id, byName: me.name, at: ts,
      from: oldP, to: newP,
    });
  }
  if ((oldTask.assigneeId || '') !== (newTask.assigneeId || '')) {
    news.push({
      id: uid(), type: 'assignee_changed',
      byId: me.id, byName: me.name, at: ts,
      from: oldTask.assigneeName, to: newTask.assigneeName,
    });
  }
  if (oldTask.status !== newTask.status) {
    news.push({
      id: uid(), type: 'status_changed',
      byId: me.id, byName: me.name, at: ts,
      from: oldTask.status, to: newTask.status,
    });
  }
  return news;
}

function renderActivitySection(task) {
  const activity = task.activity || [];
  if (activity.length === 0) return '';
  const items = activity.slice().reverse().slice(0, 30).map(a => {
    let text = '';
    switch (a.type) {
      case 'created': text = 'membuat tugas ini'; break;
      case 'status_changed': text = `ubah status dari <strong>${a.from || '?'}</strong> ke <strong>${a.to}</strong>`; break;
      case 'progress_changed': text = `update progress dari <strong>${a.from}%</strong> ke <strong>${a.to}%</strong>`; break;
      case 'assignee_changed': text = `pindah pelaksana dari <strong>${escapeHtml(a.from || '?')}</strong> ke <strong>${escapeHtml(a.to || '?')}</strong>`; break;
      case 'completed': text = 'tandai selesai'; break;
      default: text = a.type;
    }
    const icon = a.type === 'progress_changed' ? '📊' : a.type === 'status_changed' ? '🔄' : a.type === 'assignee_changed' ? '👤' : '✨';
    return `
      <div class="activity-item">
        <div class="activity-icon">${icon}</div>
        <div class="activity-content">
          <span class="activity-actor">${escapeHtml(a.byName || '?')}</span> ${text}
          <div class="activity-time">${timeAgo(a.at)}</div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="comments-section">
      <div class="comments-title">📜 Riwayat Aktivitas</div>
      <div class="activity-list">${items}</div>
    </div>
  `;
}

function bindProgressControl() {
  const slider = document.getElementById('t-progress');
  const valEl = document.getElementById('t-prog-value');
  const hintEl = document.getElementById('t-prog-status-hint');
  if (!slider || !valEl) return;

  function refresh(v) {
    const n = Number(v) || 0;
    valEl.textContent = `${n}%`;
    valEl.className = `progress-control-value ${progressFillClass(n)}`;
    if (hintEl) hintEl.textContent = `Status auto: ${progressToStatus(n).toUpperCase()}`;
    // Update quick buttons active state
    document.querySelectorAll('[data-progress-set]').forEach(btn => {
      btn.classList.toggle('active', Number(btn.dataset.progressSet) === n);
    });
  }
  slider.addEventListener('input', () => refresh(slider.value));
  document.querySelectorAll('[data-progress-set]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      slider.value = btn.dataset.progressSet;
      refresh(slider.value);
    });
  });
}

function renderProgressControl(initialValue, readOnly) {
  const v = Number(initialValue) || 0;
  const fillClass = progressFillClass(v);
  const statusLabel = progressToStatus(v).toUpperCase();
  return `
    <div class="progress-control">

        <div>
          <div class="label" style="margin-bottom:0">Progress</div>
          <div class="progress-control-status-hint" id="t-prog-status-hint">Status auto: ${statusLabel}</div>
        </div>
        <div class="progress-control-value ${fillClass}" id="t-prog-value">${v}%</div>

      <div class="progress-quick-row">
        ${[0, 25, 50, 75, 100].map(p =>

}

function bindCommentForm(task) {
  const btn = document.getElementById('comment-submit');
  const input = document.getElementById('comment-input');
  if (!btn || !input) return;
  btn.addEventListener('click', async () => {
    const text = input.value.trim();
    if (!text) return;
    const me = STATE.currentMember;
    const newComment = {
      id: uid(),
      authorId: me.id,
      authorName: me.name,
      text,
      createdAt: new Date().toISOString(),
    };
    try {
      await updateDoc(doc(STATE.db, 'tasks', task.id), {
        comments: arrayUnion(newComment),
        updatedAt: serverTimestamp(),
      });
      input.value = '';
      toast('Comment terkirim', 'success');
      // Re-render comments via state refresh — listener will update
      // But also update local task for immediate UX
      task.comments = [...(task.comments || []), newComment];
      const list = document.getElementById('comments-list');
      if (list) {
        list.outerHTML = renderCommentsSection(task).match(/<div id="comments-list">[\s\S]*?<\/div>(?=\s*<div class="comment-form")/)[0];
        bindCommentDelete(task);
      }
    } catch (err) {
      toast('Gagal kirim: ' + err.message, 'error');
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btn.click();
  });
}

function bindCommentDelete(task) {
  document.querySelectorAll('[data-del-comment]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.delComment, 10);
      const target = (task.comments || [])[idx];
      if (!target) return;
      if (!confirm('Hapus comment ini?')) return;
      try {
        await updateDoc(doc(STATE.db, 'tasks', task.id), {
          comments: arrayRemove(target),
          updatedAt: serverTimestamp(),
        });
        toast('Comment dihapus', 'success');
      } catch (err) {
        toast('Gagal hapus: ' + err.message, 'error');
      }
    });
  });
}

async function updateTaskStatus(taskId, newStatus) {
  const task = STATE.tasks.find(t => t.id === taskId);
  if (!task) return;
  const me = STATE.currentMember;
  const newProgress = statusToProgress(newStatus, task.progress);
  const update = {
    status: newStatus,
    progress: newProgress,
    updatedAt: serverTimestamp(),
  };
  if (newStatus === 'done' && task.status !== 'done') update.completedAt = serverTimestamp();
  if (newStatus !== 'done' && task.status === 'done') update.completedAt = null;

  // Activity log
  const ts = new Date().toISOString();
  const newActivities = [];
  if (task.status !== newStatus) {
    newActivities.push({
      id: uid(), type: 'status_changed',
      byId: me.id, byName: me.name, at: ts,
      from: task.status, to: newStatus,
    });
  }
  if ((task.progress || 0) !== newProgress) {
    newActivities.push({
      id: uid(), type: 'progress_changed',
      byId: me.id, byName: me.name, at: ts,
      from: task.progress || 0, to: newProgress,
    });
  }
  if (newActivities.length > 0) {
    update.activity = [...(task.activity || []), ...newActivities];
  }

  try {
    await updateDoc(doc(STATE.db, 'tasks', taskId), update);
  } catch (err) {
    toast('Gagal update: ' + err.message, 'error');
  }
}

/* =============================================================
   RIWAYAT PENGERJAAN MODAL (timeline activity)
   ============================================================= */
function openHistoryModal(taskId) {
  const task = STATE.tasks.find(t => t.id === taskId);
  if (!task) return;

  // Build timeline events
  const events = [];
  const activity = task.activity || [];

  // Selalu include "created" sebagai event pertama kalau ada
  if (activity.length > 0) {
    activity.forEach(a => {
      let label, markerClass = 'todo', icon = '·';
      switch (a.type) {
        case 'created':
          label = 'To do'; markerClass = 'created'; icon = '+';
          break;
        case 'status_changed':
          label = (a.to || '').toUpperCase().charAt(0) + (a.to || '').slice(1);
          markerClass = a.to === 'done' ? 'done' : (a.to === 'proses' ? 'proses' : 'todo');
          icon = a.to === 'done' ? '✓' : (a.to === 'proses' ? '◐' : '○');
          break;
        case 'progress_changed':
          label = `Progress: ${a.to}%`;
          markerClass = 'progress';
          icon = '%';
          break;
        case 'assignee_changed':
          label = `Pelaksana → ${a.to || '?'}`;
          markerClass = 'todo';
          icon = '👤';
          break;
        default:
          label = a.type;
      }
      events.push({ ...a, label, markerClass, icon });
    });
  } else {
    // Tidak ada activity tracker — fallback ke createdAt + completedAt
    if (task.createdAt) {
      events.push({
        type: 'created', label: 'Dibuat',
        markerClass: 'created', icon: '+',
        byName: task.createdByName, at: task.createdAt,
      });
    }
    if (task.completedAt) {
      events.push({
        type: 'completed', label: 'Selesai',
        markerClass: 'done', icon: '✓',
        byName: task.assigneeName, at: task.completedAt,
      });
    }
  }

  // Format date/time
  function fmtDateTime(at) {
    if (!at) return '';
    const d = typeof at === 'string' ? new Date(at) : (at.toDate ? at.toDate() : new Date(at));
    const dd = String(d.getDate()).padStart(2, '0');
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const mm = months[d.getMonth()];
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return { date: `${dd} ${mm} ${yyyy}`, time: `${hh}.${min}` };
  }

  const itemsHtml = events.map(ev => {
    const dt = fmtDateTime(ev.at);
    return `
      <div class="timeline-item">
        <div class="timeline-marker ${ev.markerClass}">${ev.icon}</div>
        <div class="timeline-status">${escapeHtml(ev.label)}</div>
        ${ev.byName ? `<div class="timeline-detail">oleh <strong>${escapeHtml(ev.byName)}</strong></div>` : ''}
        <div class="timeline-meta">
          <span class="timeline-meta-item">📅 ${dt.date || ''}</span>
          <span class="timeline-meta-item">🕐 ${dt.time || ''}</span>
        </div>
      </div>
    `;
  }).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">🕐 Riwayat Pengerjaan</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">

/* =============================================================
