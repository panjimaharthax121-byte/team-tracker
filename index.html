  showModal(`
    <div class="modal-header">
      <div class="modal-title">🔔 Pengaturan Notifikasi</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:12px;margin-bottom:14px">
        Pengaturan tersimpan per device (browser kamu). Cara kerja: Team Tracker harus dibuka (tab aktif/background) untuk notif muncul.
      </p>

      <div style="padding:10px 14px;background:var(--bg-col);border-radius:var(--radius);margin-bottom:14px;font-size:12px">
        <strong>Status Izin Notif Browser:</strong> ${permLabel[permStatus] || permStatus}
        ${permStatus === 'default' ? '<div style="margin-top:6px"><button class="btn btn-primary btn-sm" id="req-perm">Minta Izin Sekarang</button></div>' : ''}
      </div>

      <div class="form-group" style="padding:12px 14px;background:var(--bg-col);border-radius:var(--radius);margin-bottom:10px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600">
          <input type="checkbox" id="ns-enabled" ${s.enabled ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
          Aktifkan Notifikasi
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:24px">Master switch — kalau off semua notif disabled</div>
      </div>

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="ns-sound" ${s.soundEnabled ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
          🔊 Mainkan suara saat notif tugas (3 detik)
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:24px">Buat notif tugas baru / start time / reminder harian</div>
      </div>

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="ns-chat-sound" ${s.chatSoundEnabled !== false ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
          💬 Mainkan suara saat chat baru (pendek, ~0.5 detik)
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:24px">Ding-dong pendek tapi tetap keras — gak ngeganggu lama</div>
      </div>

      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="ns-new-task" ${s.notifyOnNewTask ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
          🆕 Notif kalau ada tugas baru ditambah ke saya (atau ke tim, kalau admin)
        </label>
      </div>

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="ns-start-time" ${s.notifyOnStartTime ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
          ⏰ Notif saat jam mulai tugas tiba
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:24px">Pas jadwal "Jam Mulai" task milik kamu tiba, browser akan reminder</div>
      </div>

      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="ns-daily" ${s.notifyDailyReminder ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
          📋 Reminder harian (jam yang dipilih)
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:24px;margin-bottom:8px">Tiap hari di jam yang kamu set, kalau masih ada tugas belum selesai, akan notif</div>
        <div style="padding-left:24px">
          <input type="time" id="ns-reminder-time" class="input" value="${s.reminderTime}" style="width:auto;padding:6px 10px;font-size:14px">
        </div>
      </div>

      <hr style="border:0;border-top:1px solid var(--border);margin:14px 0">

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" id="ns-test">🧪 Test Notif Tugas</button>
        <button class="btn btn-secondary btn-sm" id="ns-test-chat">💬 Test Sound Chat</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Batal</button>
      <button class="btn btn-primary" id="ns-save">Simpan</button>
    </div>
  `);

  const reqBtn = document.getElementById('req-perm');
  if (reqBtn) reqBtn.addEventListener('click', async () => {
    const ok = await requestNotifPermission();
    if (ok) {
      toast('Izin notif diberikan', 'success');
      closeModal();
      setTimeout(openNotifSettingsModal, 100);
    } else {
      toast('Izin notif ditolak', 'error');
    }
  });

  document.getElementById('ns-test').addEventListener('click', async () => {
    // Try request permission (for native browser notif), tapi in-app notif tetap jalan walau gak ada permission
    if ('Notification' in window && Notification.permission !== 'granted') {
      await requestNotifPermission();
    }
    showNotif(
      '🔔 Tes Notifikasi',
      'Notifikasi Team Tracker bekerja! Suara berbunyi sekitar 3 detik. Klik notifikasi ini untuk close.',
      { tag: 'test-notif', type: 'default' }
    );
    // Force play sound walaupun belum di-enable di settings (untuk test)
    const oldEnabled = STATE.notifSettings?.enabled;
    const oldSound = STATE.notifSettings?.soundEnabled;
    if (STATE.notifSettings) {
      STATE.notifSettings.enabled = true;
      STATE.notifSettings.soundEnabled = true;
    }
    playNotifSound();
    if (STATE.notifSettings) {
      STATE.notifSettings.enabled = oldEnabled;
      STATE.notifSettings.soundEnabled = oldSound;
    }
  });

  // v2.20: test sound chat khusus
  document.getElementById('ns-test-chat')?.addEventListener('click', () => {
    showAppNotif(
      '💬 Tes Sound Chat',
      'Ding-dong! Pendek tapi tetap keras.',
      { type: 'default', icon: '💬' }
    );
    const oldEnabled = STATE.notifSettings?.enabled;
    const oldChat = STATE.notifSettings?.chatSoundEnabled;
    if (STATE.notifSettings) {
      STATE.notifSettings.enabled = true;
      STATE.notifSettings.chatSoundEnabled = true;
    }
    playChatSound();
    if (STATE.notifSettings) {
      STATE.notifSettings.enabled = oldEnabled;
      STATE.notifSettings.chatSoundEnabled = oldChat;
    }
  });

  document.getElementById('ns-save').addEventListener('click', async () => {
    const enabled = document.getElementById('ns-enabled').checked;
    // Kalau enable & belum granted, minta permission
    if (enabled && Notification.permission !== 'granted') {
      const ok = await requestNotifPermission();
      if (!ok) {
        toast('Notif tidak bisa di-aktifkan tanpa izin browser', 'error');
        return;
      }
    }
    const newSettings = {
      enabled,
      soundEnabled: document.getElementById('ns-sound').checked,
      chatSoundEnabled: document.getElementById('ns-chat-sound').checked,
      notifyOnNewTask: document.getElementById('ns-new-task').checked,
      notifyOnStartTime: document.getElementById('ns-start-time').checked,
      notifyDailyReminder: document.getElementById('ns-daily').checked,
      reminderTime: document.getElementById('ns-reminder-time').value || '09:00',
    };
    saveNotifSettings(newSettings);
    toast('Pengaturan notif tersimpan', 'success');
    closeModal();
  });
}

function openShareKitModal() {
  const cfg = getStoredConfig();
  if (!cfg) { toast('Config Firebase belum di-setup', 'error'); return; }

  const isEmbedded = !!EMBEDDED_CONFIG;
  const currentUrl = window.location.href.split('?')[0].split('#')[0];

  showModal(`
    <div class="modal-header">
      <div class="modal-title">🔗 Bagikan ke Tim</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:14px;color:var(--text-muted);font-size:13px">
        Generate file <code style="background:var(--bg-col);padding:1px 6px;border-radius:4px;font-size:12px">index.html</code>
        yang sudah punya config Firebase tertanam — supaya Adit & Prayoga tinggal buka URL + password,
        tanpa perlu paste config Firebase manual.
      </p>

      ${isEmbedded ? `
        <div style="background:var(--success-light);color:#065f46;padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:13px">
          ✅ <strong>File ini sudah punya embedded config</strong> — Adit & Prayoga yang buka URL ini
          langsung masuk tanpa setup wizard.
        </div>
      ` : `
        <div style="background:var(--warning-light);color:#92400e;padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:13px">
          ⚠️ <strong>File yang sedang kamu pakai belum embedded.</strong> Klik tombol di bawah untuk
          generate file baru yang sudah include config.
        </div>
      `}

      <h4 style="font-size:13px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.3px">Langkah Setup Sekali:</h4>
      <ol style="padding-left:20px;font-size:13px;line-height:1.7;color:var(--text);margin-bottom:18px">
        <li>Klik <strong>Download index.html</strong> di bawah</li>
        <li>Buka <a href="https://github.com" target="_blank" style="color:var(--primary)">github.com</a> → repo <code style="background:var(--bg-col);padding:1px 6px;border-radius:4px;font-size:11px">team-tracker</code></li>
        <li>Klik file <code style="background:var(--bg-col);padding:1px 6px;border-radius:4px;font-size:11px">index.html</code> → ikon pensil (Edit) → atau langsung klik <strong>Add file → Upload files</strong> → drag file baru → <strong>Commit changes</strong> (akan replace yang lama)</li>
        <li>Tunggu ~1 menit. Setelah itu Adit & Prayoga tinggal akses URL, masukin password, pilih nama mereka.</li>
      </ol>

      <h4 style="font-size:13px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.3px">Yang Tetap Mereka Butuhkan:</h4>
      <div class="task-meta-row" style="margin-bottom:0">
        <div style="display:block;width:100%">
          <div style="margin-bottom:4px"><strong>URL:</strong> <span style="font-family:ui-monospace,monospace;font-size:12px">${escapeHtml(currentUrl)}</span></div>
          <div><strong>Password tim:</strong> <span style="font-family:ui-monospace,monospace;font-size:12px">(yang udah kamu set)</span></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Tutup</button>
      <button class="btn btn-primary" id="sk-download">⬇ Download index.html</button>
    </div>
  `, { size: 'lg' });

  document.getElementById('sk-download').addEventListener('click', async () => {
    try {
      const btn = document.getElementById('sk-download');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> Generate...';
      const res = await fetch(window.location.href);
      if (!res.ok) throw new Error('Gagal fetch source: HTTP ' + res.status);
      let html = await res.text();
      const cfgJson = JSON.stringify(cfg);
      // Replace baris EMBEDDED_CONFIG. Format: `const EMBEDDED_CONFIG = ...;`
      const re = /const\s+EMBEDDED_CONFIG\s*=\s*[^;]+;/;
      if (!re.test(html)) {
        toast('Template EMBEDDED_CONFIG tidak ketemu di source — coba update file lokal dulu', 'error');
        btn.disabled = false;
        btn.textContent = '⬇ Download index.html';
        return;
      }
      html = html.replace(re, `const EMBEDDED_CONFIG = ${cfgJson};`);
      downloadFile('index.html', html, 'text/html');
      toast('File ke-download — upload ulang ke GitHub Pages', 'success');
      btn.disabled = false;
      btn.textContent = '⬇ Download index.html';
    } catch (err) {
      toast('Gagal: ' + err.message, 'error');
      const btn = document.getElementById('sk-download');
      if (btn) { btn.disabled = false; btn.textContent = '⬇ Download index.html'; }
    }
  });
}

   EXPORT MODAL
   ============================================================= */
function openExportModal() {
  showModal(`
    <div class="modal-header">
      <div class="modal-title">Export Data untuk Analisa</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:14px;color:var(--text-muted);font-size:13px">
        Export task dalam range tanggal tertentu — bisa kasih file-nya ke Claude untuk minta analisa
        (mis: produktivitas per orang, status distribution, stuck tasks, dll).
      </p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div class="form-group">
          <label class="label">Dari Tanggal</label>
          <input type="date" id="exp-from" class="input" value="${shiftDate(todayStr(), -6)}">
        </div>
        <div class="form-group">
          <label class="label">Sampai Tanggal</label>
          <input type="date" id="exp-to" class="input" value="${todayStr()}">
        </div>
      </div>
      <div class="form-group">
        <label class="label">Filter Anggota (opsional)</label>
        <select id="exp-member" class="select">
          <option value="">Semua anggota</option>
          ${STATE.members.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="label">Format</label>
        <select id="exp-format" class="select">
          <option value="json">JSON (paling lengkap, buat dianalisa Claude)</option>
          <option value="csv">CSV (buka di Excel)</option>
          <option value="markdown">Markdown (laporan readable)</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Batal</button>
      <button class="btn btn-primary" id="exp-go">Export & Download</button>
    </div>
  `);

  document.getElementById('exp-go').addEventListener('click', async () => {
    const from = document.getElementById('exp-from').value;
    const to = document.getElementById('exp-to').value;
    const memberFilter = document.getElementById('exp-member').value;
    const format = document.getElementById('exp-format').value;
    if (!from || !to) { toast('Tanggal wajib diisi', 'error'); return; }
    if (from > to) { toast('Tanggal "dari" harus sebelum "sampai"', 'error'); return; }

    try {
      toast('Mengambil data...', '');
      const tasksRef = collection(STATE.db, 'tasks');
      const q = query(tasksRef, where('date', '>=', from), where('date', '<=', to));
      const snap = await getDocs(q);
      let tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (memberFilter) tasks = tasks.filter(t => t.assigneeId === memberFilter);
      tasks.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));

      const filename = `team_tracker_${from}_to_${to}${memberFilter ? '_' + STATE.members.find(m => m.id === memberFilter)?.name : ''}.${format === 'markdown' ? 'md' : format}`;

      let content = '';
      if (format === 'json') {
        content = JSON.stringify({
          export_date: new Date().toISOString(),
          range: { from, to },
          member_filter: memberFilter || 'all',
          members: STATE.members.map(m => ({ id: m.id, name: m.name, role: m.role })),
          tasks: tasks.map(t => ({
            id: t.id,
            title: t.title,
            description: t.description || '',
            status: t.status,
            progress: t.progress || 0,
            target: t.target || 0,
            progress_count: t.progressCount || 0,
            date: t.date,
            start_time: t.startTime || null,
            end_time: t.endTime || null,
            due_date: t.dueDate || null,
            category: t.category || null,
            labels: (t.labelIds || [])
              .map(id => STATE.labels.find(l => l.id === id)?.name)
              .filter(Boolean),
            is_shared: !!t.isShared,
            is_project: !!t.isProject,
            from_template: t.fromTemplateName || null,
            assignee: t.assigneeName,
            created_by: t.createdByName,
            created_at: tsToIso(t.createdAt),
            updated_at: tsToIso(t.updatedAt),
            completed_at: tsToIso(t.completedAt),
            checklists: (t.checklists || []).map(cl => ({
              title: cl.title || '',
              items: (cl.items || []).map(it => ({ text: it.text, done: !!it.done })),
            })),
            comments: (t.comments || []).map(c => ({
              author: c.authorName,
              text: c.text,
              at: c.createdAt,
            })),
            activity: (t.activity || []).map(a => ({
              type: a.type, by: a.byName, at: a.at, from: a.from, to: a.to,
            })),
          })),
        }, null, 2);
      } else if (format === 'csv') {
        const header = [
          'Tanggal', 'Jam Mulai', 'Jam Selesai', 'Kategori', 'Judul', 'Deskripsi',
          'Pelaksana', 'Status', 'Progress %', 'Target', 'Terlaksana',
          'Label', 'Dari Template', 'Deadline',
          'Dibuat Oleh', 'Dibuat', 'Update Terakhir', 'Selesai', 'Jumlah Comment',
        ];
        const rows = tasks.map(t => {
          const cat = CATEGORIES.find(c => c.id === t.category);
          const labels = (t.labelIds || [])
            .map(id => STATE.labels.find(l => l.id === id)?.name)
            .filter(Boolean).join(' · ');
          return [
            t.date,
            t.startTime || '',
            t.endTime || '',
            cat ? cat.name : '',
            t.title || '',
            (t.description || '').replace(/[\r\n]+/g, ' '),
            t.assigneeName || '',
            (t.status || '').toUpperCase(),
            `${t.progress || 0}%`,
            t.target || '',
            t.progressCount || '',
            labels,
            t.fromTemplateName || '',
            t.dueDate || '',
            t.createdByName || '',
            tsToIso(t.createdAt),
            tsToIso(t.updatedAt),
            tsToIso(t.completedAt),
            (t.comments || []).length,
          ];
        });
        content = [header, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
      } else {
        // markdown
        content = `# Laporan Team Tracker\n\n**Periode:** ${from} s/d ${to}\n**Anggota:** ${memberFilter ? STATE.members.find(m => m.id === memberFilter)?.name : 'Semua tim'}\n**Total tugas:** ${tasks.length}\n\n`;
        const byDate = {};
        tasks.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });
        Object.keys(byDate).sort().forEach(d => {
          content += `\n## ${d} (${dateLabel(d)})\n\n`;
          byDate[d].forEach(t => {
            const statusIcon = t.status === 'done' ? '[DONE]' : t.status === 'proses' ? '[PROSES]' : '[TODO]';
            const cat = CATEGORIES.find(c => c.id === t.category);
            const catStr = cat ? ` [${cat.name}]` : '';
            const timeStr = (t.startTime || t.endTime) ? ` ⏰ ${t.startTime || '?'}${t.endTime ? '–' + t.endTime : ''}` : '';
            const targetStr = (Number(t.target) || 0) > 0 ? ` (target ${t.progressCount || 0}/${t.target})` : '';
            const progressStr = ` · ${t.progress || 0}%`;
            content += `- ${statusIcon}${catStr} **${t.title}**${timeStr}${targetStr}${progressStr} — _${t.assigneeName}_\n`;
            if (t.description) content += `  > ${t.description}\n`;
            (t.comments || []).forEach(c => {
              content += `  - 💬 ${c.authorName}: ${c.text}\n`;
            });
          });
        });

        // Summary
        content += `\n## Ringkasan\n\n`;
        const byStatus = {};
        tasks.forEach(t => { byStatus[t.status] = (byStatus[t.status] || 0) + 1; });
        content += `**Status distribution:** ${Object.entries(byStatus).map(([k, v]) => `${k.toUpperCase()}: ${v}`).join(' · ')}\n\n`;
        const byMember = {};
        tasks.forEach(t => {
          const k = t.assigneeName || '?';
          byMember[k] = byMember[k] || { total: 0, done: 0 };
          byMember[k].total++;
          if (t.status === 'done') byMember[k].done++;
        });
        content += `**Per anggota:**\n`;
        Object.entries(byMember).forEach(([k, v]) => {
          content += `- ${k}: ${v.total} tugas (${v.done} done = ${Math.round(v.done/v.total*100)}%)\n`;
        });
      }

      downloadFile(filename, content, format === 'json' ? 'application/json' : format === 'csv' ? 'text/csv' : 'text/markdown');
      toast(`Exported: ${tasks.length} tugas`, 'success');
      closeModal();
    } catch (err) {
      toast('Gagal export: ' + err.message, 'error');
      console.error(err);
    }
  });
}

function tsToIso(ts) {
  if (!ts) return '';
  if (typeof ts === 'string') return ts;
  if (ts.toDate) return ts.toDate().toISOString();
  if (ts instanceof Date) return ts.toISOString();
  return String(ts);
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
