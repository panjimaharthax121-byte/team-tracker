      </select>
    </div>
  ` : '';

  // Category section (selalu tampil)
  const catDescriptions = {
    'b2c': 'Tugas terkait B2C (offline / sales / outlet)',
    'online': 'Tugas terkait kanal online (Grab/Halo/Shopee/dll)',
    'optimize': 'Tugas optimasi proses internal / tool',
  };
  const categorySection = `
    <div class="form-group">
      <label class="label">Kategori Tugas <span style="color:var(--danger)">*</span></label>
      <div class="category-select" id="t-category-row">
        ${CATEGORIES.map(c => `
          <button type="button"
            class="category-option ${initialCategory === c.id ? 'active' : ''}"
            data-category="${c.id}"
            style="color:${c.color}"
            ${readOnly ? 'disabled' : ''}>
            <div class="category-option-name">${escapeHtml(c.name)}</div>
            <div class="category-option-desc">${escapeHtml(catDescriptions[c.id] || '')}</div>
          </button>
        `).join('')}
      </div>
    </div>
  `;

  // Labels section — ALWAYS render (fix bug: section hilang kalau STATE.labels kosong/race)
  const labelsSection = `
    <div class="form-group">
      <label class="label">Label</label>
      ${STATE.labels.length > 0 ? `
        <div class="chip-row" id="t-labels-row">
          ${STATE.labels.map(l => `
            <button type="button" class="label-toggle ${initialLabelIds.includes(l.id) ? 'active' : ''}"
              data-toggle-label="${l.id}" style="color:${l.color}" ${disabledAttr}>
              <span class="label-dot" style="background:${l.color}"></span>
              ${escapeHtml(l.name)}
            </button>
          `).join('')}
        </div>
      ` : `
        <div style="padding:10px 12px;background:var(--bg-col);border-radius:var(--radius-sm);font-size:12px;color:var(--text-muted)">
          ⏳ Belum ada label di board ini. Admin bisa tambah via menu <strong>🏷️ Labels</strong> di sidebar.
        </div>
      `}
    </div>
  `;

  // Checklists section
  const checklistsSection = `
    <div class="form-group">
      <label class="label">Checklist</label>
      <div id="t-checklists-root">${renderChecklistsEditor(initialChecklists, readOnly)}</div>
      ${readOnly ? '' : `<button type="button" class="btn btn-secondary btn-sm" id="t-add-checklist" style="margin-top:6px">+ Tambah Checklist Baru</button>`}
    </div>
  `;

  const html = `
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div class="modal-title">
          ${isEdit ? (readOnly ? '👁️ Lihat Tugas' : 'Edit Tugas') : 'Tugas Baru'}
        </div>
        ${readOnly ? `<span class="readonly-badge">🔒 Read-only — bukan task kamu</span>` : ''}
      </div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      ${templatePicker}
      <div class="form-group">
        <label class="label">Judul Tugas</label>
        <input id="t-title" class="input" placeholder="Mis: Bikin laporan B2C minggu ini" value="${escapeHtml(initialTitle)}" autocomplete="off" ${disabledAttr}>
      </div>
      ${categorySection}
      ${labelsSection}
      <div class="form-group">
        <label class="label">Deskripsi (opsional)</label>
        <textarea id="t-desc" class="textarea" placeholder="Detail tugas..." ${disabledAttr}>${escapeHtml(initialDesc)}</textarea>
      </div>
      <div class="form-group">
        ${renderProgressControl(task?.progress ?? presets.progress ?? 0, initialTarget, initialProgressCount, readOnly)}
      </div>

      ${isEdit ? renderTimeTracker(task) : ''}

      <div class="form-group">
        <label class="label">Pelaksana ${initialIsShared ? '<span style="color:var(--text-muted);font-weight:400">(opsional kalau bersama)</span>' : ''}</label>
        <select id="t-assignee" class="select" ${canChangeAssignee ? '' : 'disabled'}>${memberOpts}</select>
      </div>

      <!-- Tugas Proyek toggle -->
      <div class="form-group" style="padding:12px 14px;background:${initialIsProject ? '#ede9fe' : 'var(--bg-col)'};border-radius:var(--radius);transition:background .2s" id="t-project-wrap">
        <label style="display:flex;align-items:center;gap:10px;cursor:${readOnly ? 'default' : 'pointer'};font-weight:600;font-size:13px">
          <input type="checkbox" id="t-project" ${initialIsProject ? 'checked' : ''} ${readOnly ? 'disabled' : ''} style="width:16px;height:16px;cursor:inherit;accent-color:#6b21a8">
          📌 Tugas Proyek (multi-hari)
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:26px">
          Kalau dicentang, task muncul di kanban setiap hari dalam range Tanggal Mulai - Tanggal Selesai (kecuali sudah done).
        </div>
      </div>

      <!-- Tanggal: 2 mode — single date (task biasa) ATAU range (proyek) -->
      <div id="t-date-single-wrap" class="form-group" style="display:${initialIsProject ? 'none' : 'block'}">
        <label class="label">Tanggal Aktif</label>
        <input type="date" id="t-date" class="input" value="${task?.date || STATE.selectedDate}" ${disabledAttr}>
      </div>
      <div id="t-date-range-wrap" style="display:${initialIsProject ? 'grid' : 'none'};grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group">
          <label class="label">📆 Tanggal Mulai</label>
          <input type="date" id="t-date-range" class="input" value="${task?.date || STATE.selectedDate}" ${disabledAttr}>
        </div>
        <div class="form-group">
          <label class="label">📆 Tanggal Selesai</label>
          <input type="date" id="t-due-range" class="input" value="${initialDueDate || task?.date || STATE.selectedDate}" ${disabledAttr}>
        </div>
      </div>

      <div class="form-group" style="padding:12px 14px;background:${initialIsShared ? 'var(--success-light)' : 'var(--bg-col)'};border-radius:var(--radius);transition:background .2s" id="t-shared-wrap">
        <label style="display:flex;align-items:center;gap:10px;cursor:${readOnly ? 'default' : 'pointer'};font-weight:600;font-size:13px">
          <input type="checkbox" id="t-shared" ${initialIsShared ? 'checked' : ''} ${readOnly ? 'disabled' : ''} style="width:16px;height:16px;cursor:inherit;accent-color:var(--success)">
          👥 Tugas Bersama
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:26px">
          Kalau dicentang, task muncul di kanban semua anggota tim dan siapa pun bisa update progress.
        </div>
      </div>

      <div id="t-jam-deadline-grid" style="display:grid;grid-template-columns:${initialIsProject ? '1fr 1fr' : '1fr 1fr 1fr'};gap:10px">
        <div class="form-group">
          <label class="label">Jam Mulai (opsional)</label>
          <input type="time" id="t-start-time" class="input" value="${initialStartTime}" ${disabledAttr}>
        </div>
        <div class="form-group">
          <label class="label">Jam Selesai (opsional)</label>
          <input type="time" id="t-end-time" class="input" value="${initialEndTime}" ${disabledAttr}>
        </div>
        <div class="form-group" id="t-due-single-wrap" style="display:${initialIsProject ? 'none' : 'block'}">
          <label class="label">Deadline (opsional)</label>
          <input type="date" id="t-due" class="input" value="${initialDueDate}" ${disabledAttr}>
        </div>
      </div>

      ${checklistsSection}

      ${task?.notCompleted ? `
        <div class="form-group">
          <label class="label" style="color:var(--danger)">🚫 Tugas Ditandai Tidak Selesai</label>
          <div style="background:#fef2f2;border-left:3px solid #dc2626;padding:10px 12px;border-radius:6px;color:#991b1b;font-size:13px;line-height:1.5">
            <strong>Alasan:</strong> ${escapeHtml(task.kendala || '(tidak ada catatan)')}
            ${task.notCompletedAt ? `<div style="font-size:11px;color:#7f1d1d;margin-top:6px">Ditandai pada ${new Date(task.notCompletedAt).toLocaleString('id-ID')}</div>` : ''}
            <div style="margin-top:8px">
              <button class="btn btn-sm btn-ghost" id="t-clear-notdone" type="button" ${disabledAttr}>↺ Kerjakan Ulang</button>
            </div>
          </div>
        </div>
      ` : ''}

      ${isEdit ? renderTaskMetaInfo(task) : ''}
      ${isEdit ? renderActivitySection(task) : ''}
      ${isEdit ? renderCommentsSection(task) : ''}
    </div>
    <div class="modal-footer">
      ${isEdit && canDelete ? `<button class="btn btn-danger" id="t-delete" style="margin-right:auto">Hapus</button>` : ''}
      <button class="btn btn-ghost" data-close-modal>${readOnly ? 'Tutup' : 'Batal'}</button>
      ${readOnly ? '' : `<button class="btn btn-primary" id="t-save">${isEdit ? 'Simpan' : 'Buat Tugas'}</button>`}
    </div>
  `;

  showModal(html, { size: 'lg' });

  // Read-only mode: no save handler, tetap bisa comment
  if (readOnly) {
    if (isEdit) bindCommentForm(task);
    if (isEdit) bindCommentDelete(task);
    return;
  }

  // Mutable state untuk modal (labels, checklists, category, target/counter, shared, project)
  const MODAL_STATE = {
    labelIds: [...initialLabelIds],
    checklists: JSON.parse(JSON.stringify(initialChecklists)),
    category: initialCategory,
    target: initialTarget,
    progressCount: initialProgressCount,
    isShared: initialIsShared,
    isProject: initialIsProject,
  };

  // Bind progress + target counter (slider/counter switch berdasarkan target value)
  bindProgressControl(MODAL_STATE, readOnly);

  bindCategorySelect(MODAL_STATE);
  bindLabelToggles(MODAL_STATE);
  bindChecklistEditor(MODAL_STATE, readOnly);
  bindTemplatePicker();

  // Bind shared checkbox
  const sharedCb = document.getElementById('t-shared');
  const sharedWrap = document.getElementById('t-shared-wrap');
  if (sharedCb && !readOnly) {
    sharedCb.addEventListener('change', () => {
      MODAL_STATE.isShared = sharedCb.checked;
      if (sharedWrap) sharedWrap.style.background = sharedCb.checked ? 'var(--success-light)' : 'var(--bg-col)';
    });
  }

  // Bind project checkbox — toggle date single ↔ range
  const projectCb = document.getElementById('t-project');
  const projectWrap = document.getElementById('t-project-wrap');
  const dateSingleWrap = document.getElementById('t-date-single-wrap');
  const dateRangeWrap = document.getElementById('t-date-range-wrap');
  const dueSingleWrap = document.getElementById('t-due-single-wrap');
  const jamDeadlineGrid = document.getElementById('t-jam-deadline-grid');
  if (projectCb && !readOnly) {
    projectCb.addEventListener('change', () => {
      MODAL_STATE.isProject = projectCb.checked;
      const on = projectCb.checked;
      if (projectWrap) projectWrap.style.background = on ? '#ede9fe' : 'var(--bg-col)';
      if (dateSingleWrap) dateSingleWrap.style.display = on ? 'none' : 'block';
      if (dateRangeWrap) dateRangeWrap.style.display = on ? 'grid' : 'none';
      if (dueSingleWrap) dueSingleWrap.style.display = on ? 'none' : 'block';
      if (jamDeadlineGrid) jamDeadlineGrid.style.gridTemplateColumns = on ? '1fr 1fr' : '1fr 1fr 1fr';
      // Sync values between single & range inputs
      if (on) {
        const dRange = document.getElementById('t-date-range');
        const dueRange = document.getElementById('t-due-range');
        const dSingle = document.getElementById('t-date');
        if (dRange && dSingle && !dRange.value) dRange.value = dSingle.value;
        if (dueRange && dRange && !dueRange.value) dueRange.value = dRange.value;
      } else {
        const dSingle = document.getElementById('t-date');
        const dRange = document.getElementById('t-date-range');
        if (dSingle && dRange && dRange.value) dSingle.value = dRange.value;
      }
    });
  }

  document.getElementById('t-save').addEventListener('click', async () => {
    const title = document.getElementById('t-title').value.trim();
    const desc = document.getElementById('t-desc').value.trim();
    const sliderEl = document.getElementById('t-progress');
    const sliderProgress = sliderEl ? (Number(sliderEl.value) || 0) : 0;
    const target = Number(MODAL_STATE.target) || 0;
    const progressCount = Number(MODAL_STATE.progressCount) || 0;
    // Kalau target > 0, derive progress dari counter; else pakai slider
    let progress = target > 0
      ? Math.min(100, Math.round(progressCount * 100 / target))
      : sliderProgress;
    let status = progressToStatus(progress);
    const assigneeId = document.getElementById('t-assignee').value;
    const isProject = !!MODAL_STATE.isProject;
    // Date logic: kalau project, pakai range; else pakai single + optional dueDate
    let date, dueDate;
    if (isProject) {
      date = document.getElementById('t-date-range').value;
      dueDate = document.getElementById('t-due-range').value || date;
      if (dueDate < date) {
        toast('Tanggal Selesai harus >= Tanggal Mulai', 'error'); return;
      }
    } else {
      date = document.getElementById('t-date').value;
      dueDate = document.getElementById('t-due').value || null;
    }
    const startTime = document.getElementById('t-start-time').value || null;
    const endTime = document.getElementById('t-end-time').value || null;
    if (!title) { toast('Judul wajib diisi', 'error'); return; }
    if (!date) { toast('Tanggal wajib diisi', 'error'); return; }
    if (!MODAL_STATE.category) { toast('Pilih kategori tugas (B2C / Online / Optimize)', 'error'); return; }
    const assignee = STATE.members.find(m => m.id === assigneeId);
    if (!assignee) { toast('Pelaksana tidak valid', 'error'); return; }

    // Auto-sync progress kalau ada checklist (hanya kalau gak pakai target)
    const cInfo = computeChecklistTotalArr(MODAL_STATE.checklists);
    let finalProgress = progress;
    if (target === 0 && cInfo.total > 0 && (cInfo.done === cInfo.total) && progress < 100) {
      // Semua checklist done → set progress 100 kalau user belum naikin
      finalProgress = 100;
      status = 'done';
    }
    try {
      if (isEdit) {
        const update = {
          title, description: desc, status, progress: finalProgress, date, dueDate,
          startTime, endTime,
          target, progressCount,
          assigneeId, assigneeName: assignee.name,
          isShared: !!MODAL_STATE.isShared,
          isProject: !!isProject,
          category: MODAL_STATE.category,
          labelIds: MODAL_STATE.labelIds,
          checklists: MODAL_STATE.checklists,
          updatedAt: serverTimestamp(),
        };
        // Activity log
        const activity = task.activity || [];
        const newActivities = diffActivities(task, update, me);
        if (newActivities.length > 0) update.activity = [...activity, ...newActivities];
        if (status === 'done' && task.status !== 'done') update.completedAt = serverTimestamp();
        if (status !== 'done' && task.status === 'done') update.completedAt = null;
        // v2.24: AUTO TIME TRACK saat status berubah dari modal
        const tt = applyAutoTimeTrack(task, task.status, status, me.id, me.name);
        if (tt) update.timeLog = tt.timeLog;
        await updateDoc(doc(STATE.db, 'tasks', task.id), update);
        toast('Tugas tersimpan', 'success');
      } else {
        await addDoc(collection(STATE.db, 'tasks'), {
          title, description: desc, status, progress: finalProgress, date, dueDate,
          startTime, endTime,
          target, progressCount,
          assigneeId, assigneeName: assignee.name,
          isShared: !!MODAL_STATE.isShared,
          isProject: !!isProject,
          boardId: STATE.currentBoardId,
          category: MODAL_STATE.category,
          labelIds: MODAL_STATE.labelIds,
          checklists: MODAL_STATE.checklists,
          createdById: me.id, createdByName: me.name,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          completedAt: status === 'done' ? serverTimestamp() : null,
          comments: [],
          activity: [{
            id: uid(), type: 'created', byId: me.id, byName: me.name,
            at: new Date().toISOString(),
          }],
        });
        toast('Tugas dibuat', 'success');
      }
      closeModal();
    } catch (err) {
      toast('Gagal simpan: ' + err.message, 'error');
    }
  });

  // v2.24: Tombol Start/Stop manual DIHAPUS — time tracking sekarang auto via status (proses=start, lain=stop).
  // Logic di applyAutoTimeTrack() + di-hook di updateTaskStatus + save handler modal.

  // v2.24: Tombol "Kerjakan Ulang" di section notCompleted (kalau task ditandai gak selesai)
  if (isEdit) {
    const clearNd = document.getElementById('t-clear-notdone');
    if (clearNd) {
      clearNd.addEventListener('click', async () => {
        if (!confirm('Kerjakan ulang task ini? Status balik ke TODO & flag tidak selesai dihapus.')) return;
        try {
          await updateDoc(doc(STATE.db, 'tasks', task.id), {
            notCompleted: false,
            kendala: null,
            notCompletedAt: null,
            status: 'todo',
            progress: 0,
            updatedAt: serverTimestamp(),
          });
          toast('Task dikerjakan ulang', 'success');
          closeModal();
        } catch (err) {
          toast('Gagal: ' + err.message, 'error');
        }
      });
    }
  }

  if (isEdit) {
    const delBtn = document.getElementById('t-delete');
    if (delBtn) {
      delBtn.addEventListener('click', async () => {
        const isFromTemplate = !!task.fromTemplateId;
        const confirmMsg = isFromTemplate
          ? `Hapus tugas "${task.title}"?\n\n📌 Task ini dari template auto-harian. Hapus akan tandai task ini terhapus untuk HARI INI saja — template tetap generate task untuk hari berikutnya.`
          : `Hapus tugas "${task.title}"?`;
        if (!confirm(confirmMsg)) return;
        try {
          if (isFromTemplate) {
            // SOFT DELETE — supaya gak re-generate setelah refresh
            await updateDoc(doc(STATE.db, 'tasks', task.id), {
              isDeleted: true,
              deletedAt: serverTimestamp(),
              deletedById: STATE.currentMember.id,
              deletedByName: STATE.currentMember.name,
            });
          } else {
            // Hard delete untuk task manual non-template
            await deleteDoc(doc(STATE.db, 'tasks', task.id));
          }
          toast('Tugas dihapus', 'success');
          closeModal();
        } catch (err) {
          toast('Gagal hapus: ' + err.message, 'error');
        }
      });
    }

    // Comment form binding
    bindCommentForm(task);
    bindCommentDelete(task);
  }
}

// === Checklist helpers ===
function computeChecklistTotalArr(checklists) {
  let done = 0, total = 0;
  (checklists || []).forEach(cl => {
    (cl.items || []).forEach(it => { total++; if (it.done) done++; });
  });
  return { done, total };
}

function renderChecklistsEditor(checklists, readOnly) {
  if (!checklists || checklists.length === 0) {
    return readOnly
      ? '<div style="font-size:12px;color:var(--text-light);text-align:center;padding:8px">Tidak ada checklist</div>'
      : '';
  }
  return checklists.map((cl, ci) => {
    const items = cl.items || [];
    const done = items.filter(i => i.done).length;
    const total = items.length;
    const pct = total > 0 ? Math.round(done * 100 / total) : 0;
    return `
      <div class="checklist-block" data-cl-idx="${ci}">
        <div class="checklist-head">
          <input class="checklist-title" data-cl-title="${ci}" value="${escapeHtml(cl.title || '')}" placeholder="Judul checklist..." ${readOnly ? 'disabled' : ''}>
          <span class="checklist-progress">${done}/${total}</span>
          ${readOnly ? '' : `<button type="button" class="btn btn-ghost btn-sm" data-del-cl="${ci}" style="color:var(--danger)">✕</button>`}
        </div>
        <div class="checklist-progress-bar">
          <div class="checklist-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="checklist-items">
          ${items.map((it, ii) => `
            <div class="checklist-item">
              <input type="checkbox" data-toggle-item="${ci}.${ii}" ${it.done ? 'checked' : ''} ${readOnly ? 'disabled' : ''}>
              <input class="checklist-item-text ${it.done ? 'checked' : ''}" data-item-text="${ci}.${ii}" value="${escapeHtml(it.text || '')}" placeholder="Item..." ${readOnly ? 'disabled' : ''}>
              ${readOnly ? '' : `<button type="button" class="checklist-item-delete" data-del-item="${ci}.${ii}">✕</button>`}
            </div>
          `).join('')}
        </div>
        ${readOnly ? '' : `<button type="button" class="checklist-add-btn" data-add-item="${ci}">+ Tambah Item</button>`}
      </div>
    `;
  }).join('');
}

function bindChecklistEditor(state, readOnly) {
  const root = document.getElementById('t-checklists-root');
  const addBtn = document.getElementById('t-add-checklist');
  if (!root) return;

  function refresh() {
    root.innerHTML = renderChecklistsEditor(state.checklists, readOnly);
    attachListeners();
  }

  function attachListeners() {
    if (readOnly) return;
    // Toggle item done
    root.querySelectorAll('[data-toggle-item]').forEach(cb => {
      cb.addEventListener('change', () => {
        const [ci, ii] = cb.dataset.toggleItem.split('.').map(Number);
        state.checklists[ci].items[ii].done = cb.checked;
        refresh();
      });
    });
    // Edit item text
    root.querySelectorAll('[data-item-text]').forEach(input => {
      input.addEventListener('input', () => {
        const [ci, ii] = input.dataset.itemText.split('.').map(Number);
        state.checklists[ci].items[ii].text = input.value;
      });
      // PASTE handler — kalau multi-line, auto-split jadi multiple items
      input.addEventListener('paste', (e) => {
        const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
        if (!/[\r\n]/.test(text)) return; // single line — biarkan default
        e.preventDefault();
        const [ci, ii] = input.dataset.itemText.split('.').map(Number);
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;
        const items = state.checklists[ci].items;
        // Line 0: replace current item (kalau ada cursor selection, gunakan saja line 0 full)
        items[ii].text = lines[0];
        // Line 1..N: insert items baru setelah current
        for (let k = 1; k < lines.length; k++) {
          items.splice(ii + k, 0, { id: uid(), text: lines[k], done: false });
        }
        refresh();
        // Focus item terakhir yang baru di-insert
        setTimeout(() => {
          const inputs = root.querySelectorAll(`[data-cl-idx="${ci}"] [data-item-text]`);
          const lastIdx = ii + lines.length - 1;
          if (inputs[lastIdx]) inputs[lastIdx].focus();
        }, 50);
        toast(`${lines.length} item ditambahkan dari paste`, 'success');
      });
    });
    // Edit checklist title
    root.querySelectorAll('[data-cl-title]').forEach(input => {
      input.addEventListener('input', () => {
        const ci = Number(input.dataset.clTitle);
        state.checklists[ci].title = input.value;
      });
    });
    // Delete checklist
    root.querySelectorAll('[data-del-cl]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ci = Number(btn.dataset.delCl);
        if (!confirm('Hapus checklist ini?')) return;
        state.checklists.splice(ci, 1);
        refresh();
      });
    });
    // Delete item
    root.querySelectorAll('[data-del-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [ci, ii] = btn.dataset.delItem.split('.').map(Number);
        state.checklists[ci].items.splice(ii, 1);
        refresh();
      });
    });
    // Add item
    root.querySelectorAll('[data-add-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ci = Number(btn.dataset.addItem);
        state.checklists[ci].items.push({ id: uid(), text: '', done: false });
        refresh();
        // Focus the new item input
        setTimeout(() => {
          const inputs = root.querySelectorAll(`[data-cl-idx="${ci}"] [data-item-text]`);
          if (inputs.length) inputs[inputs.length - 1].focus();
        }, 50);
      });
    });
  }

  if (addBtn) {
    addBtn.addEventListener('click', () => {
      state.checklists.push({ id: uid(), title: 'Checklist', items: [] });
      refresh();
    });
  }
  attachListeners();
}

function bindCategorySelect(state) {
  document.querySelectorAll('[data-category]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      state.category = btn.dataset.category;
      document.querySelectorAll('[data-category]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
}

function bindLabelToggles(state) {
  document.querySelectorAll('[data-toggle-label]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const id = btn.dataset.toggleLabel;
      const idx = state.labelIds.indexOf(id);
      if (idx === -1) {
        state.labelIds.push(id);
        btn.classList.add('active');
      } else {
        state.labelIds.splice(idx, 1);
        btn.classList.remove('active');
      }
    });
  });
}

function bindTemplatePicker() {
  const sel = document.getElementById('t-template');
  if (!sel) return;
  sel.addEventListener('change', () => {
    const id = sel.value;
    if (!id) return;
    const tpl = STATE.templates.find(t => t.id === id);
    if (!tpl) return;
    // Fill title if empty
    const titleEl = document.getElementById('t-title');
    if (titleEl && !titleEl.value.trim() && tpl.title) titleEl.value = tpl.title;
    // Fill description if empty
    const descEl = document.getElementById('t-desc');
    if (descEl && !descEl.value.trim() && tpl.description) descEl.value = tpl.description;
    // Add checklist from template (only if no existing checklist)
    const checklistRoot = document.getElementById('t-checklists-root');
    if (checklistRoot && (tpl.checklists || []).length > 0 && checklistRoot.innerHTML.trim() === '') {
      // We need access to MODAL_STATE — re-trigger via custom event
      const ev = new CustomEvent('template-applied', { detail: { template: tpl } });
      document.dispatchEvent(ev);
    }
    toast(`Template "${tpl.name}" diterapkan`, 'success');
  });
  // Listen for template-applied event (binds inside bindChecklistEditor scope)
}

// === Activity helpers ===
function diffActivities(oldTask, newTask, me) {
  const news = [];
  const ts = new Date().toISOString();
  const oldP = Number(oldTask.progress) || 0;
  const newP = Number(newTask.progress) || 0;
  if (oldP !== newP) {
    news.push({
      id: uid(), type: 'progress_changed',
      byId: me.id, byName: me.name, at: ts,
      from: oldP, to: newP,
    });
  }
  if ((oldTask.assigneeId || '') !== (newTask.assigneeId || '')) {
    news.push({
      id: uid(), type: 'assignee_changed',
      byId: me.id, byName: me.name, at: ts,
      from: oldTask.assigneeName, to: newTask.assigneeName,
    });
  }
  if (oldTask.status !== newTask.status) {
    news.push({
      id: uid(), type: 'status_changed',
      byId: me.id, byName: me.name, at: ts,
      from: oldTask.status, to: newTask.status,
    });
  }
  return news;
}

function renderActivitySection(task) {
  const activity = task.activity || [];
  if (activity.length === 0) return '';
  const items = activity.slice().reverse().slice(0, 30).map(a => {
    let text = '';
    switch (a.type) {
      case 'created': text = 'membuat tugas ini'; break;
      case 'status_changed': text = `ubah status dari <strong>${a.from || '?'}</strong> ke <strong>${a.to}</strong>`; break;
      case 'progress_changed': text = `update progress dari <strong>${a.from}%</strong> ke <strong>${a.to}%</strong>`; break;
      case 'assignee_changed': text = `pindah pelaksana dari <strong>${escapeHtml(a.from || '?')}</strong> ke <strong>${escapeHtml(a.to || '?')}</strong>`; break;
      case 'completed': text = 'tandai selesai'; break;
      case 'marked_not_completed': text = `tandai <strong>tidak selesai</strong> — alasan: <em>${escapeHtml((a.reason || '').slice(0, 100))}</em>`; break;
      default: text = a.type;
    }
    const icon = a.type === 'progress_changed' ? '📊'
      : a.type === 'status_changed' ? '🔄'
      : a.type === 'assignee_changed' ? '👤'
      : a.type === 'marked_not_completed' ? '🚫'

    return `
      <div class="activity-item">

    </div>
  `;
}

function bindProgressControl(modalState, readOnly) {
  const slider = document.getElementById('t-progress');
  const valEl = document.getElementById('t-prog-value');
  const hintEl = document.getElementById('t-prog-status-hint');
  const targetInput = document.getElementById('t-target');
  const countInput = document.getElementById('t-progress-count');
  const targetMinus = document.getElementById('t-target-minus');
  const targetPlus = document.getElementById('t-target-plus');
  const targetDisplay = document.getElementById('t-target-display');

  function computeProgressFromCount() {
    const target = Number(modalState.target) || 0;
    const count = Number(modalState.progressCount) || 0;
    if (target <= 0) return null;
    const pct = Math.min(100, Math.round(count * 100 / target));
    return pct;
  }

  function refreshDisplay() {
    const target = Number(modalState.target) || 0;
    const count = Number(modalState.progressCount) || 0;
    const useCounter = target > 0;
    const pct = useCounter ? computeProgressFromCount() : (slider ? Number(slider.value) || 0 : 0);

    if (valEl) {
      valEl.textContent = `${pct}%`;
      valEl.className = `progress-control-value ${progressFillClass(pct)}`;
    }
    if (hintEl) {
      hintEl.textContent = useCounter
        ? `${count} / ${target} tercapai · status auto: ${progressToStatus(pct).toUpperCase()}`
        : `Status auto: ${progressToStatus(pct).toUpperCase()}`;
    }
    // Sync slider visibility based on target mode
    const sliderWrap = document.getElementById('t-slider-wrap');
    const counterWrap = document.getElementById('t-counter-wrap');
    if (sliderWrap) sliderWrap.style.display = useCounter ? 'none' : 'block';
    if (counterWrap) counterWrap.style.display = useCounter ? 'flex' : 'none';
    // Display target counter value
    if (targetDisplay) {
      targetDisplay.textContent = `${count} / ${target || '∞'}`;
      targetDisplay.classList.toggle('done', count >= target && target > 0);
    }
    // Update quick buttons (slider mode only)
    if (!useCounter) {
      document.querySelectorAll('[data-progress-set]').forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.progressSet) === pct);
      });
    }
    // Disable +/- kalau read-only or limit reached
    if (targetMinus) targetMinus.disabled = readOnly || count <= 0;
    if (targetPlus) targetPlus.disabled = readOnly || (target > 0 && count >= target);
  }

  if (slider) slider.addEventListener('input', () => refreshDisplay());
  document.querySelectorAll('[data-progress-set]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      if (slider) slider.value = btn.dataset.progressSet;
      refreshDisplay();
    });
  });

  if (targetInput) {
    targetInput.addEventListener('input', () => {
      let v = parseInt(targetInput.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      modalState.target = v;
      // Kalau target dikurangi di bawah progressCount, clamp progressCount
      if (v > 0 && modalState.progressCount > v) modalState.progressCount = v;
      if (countInput) countInput.value = modalState.progressCount;
      if (countInput) countInput.max = v || '';
      refreshDisplay();
    });
  }
  if (countInput) {
    countInput.addEventListener('input', () => {
      let v = parseInt(countInput.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      const target = Number(modalState.target) || 0;
      if (target > 0 && v > target) v = target;
      modalState.progressCount = v;
      refreshDisplay();
    });
  }
  if (targetMinus) {
    targetMinus.addEventListener('click', () => {
      if (readOnly) return;
      modalState.progressCount = Math.max(0, (Number(modalState.progressCount) || 0) - 1);
      if (countInput) countInput.value = modalState.progressCount;
      refreshDisplay();
    });
  }
  if (targetPlus) {
    targetPlus.addEventListener('click', () => {
      if (readOnly) return;
      const target = Number(modalState.target) || 0;
      let next = (Number(modalState.progressCount) || 0) + 1;
      if (target > 0 && next > target) next = target;
      modalState.progressCount = next;
      if (countInput) countInput.value = modalState.progressCount;
      refreshDisplay();
    });
  }

  refreshDisplay();
}

function renderProgressControl(initialProgress, initialTarget, initialCount, readOnly) {
  const p = Number(initialProgress) || 0;
  const target = Number(initialTarget) || 0;
  const count = Number(initialCount) || 0;
  const useCounter = target > 0;
  const displayPct = useCounter ? Math.min(100, target > 0 ? Math.round(count * 100 / target) : 0) : p;
  const fillClass = progressFillClass(displayPct);
  const statusLabel = progressToStatus(displayPct).toUpperCase();

  return `
    <div class="progress-control">
      <div class="progress-control-head">
        <div>
          <div class="label" style="margin-bottom:0">Progress</div>
          <div class="progress-control-status-hint" id="t-prog-status-hint">
            ${useCounter ? `${count} / ${target} tercapai · ` : ''}Status auto: ${statusLabel}
          </div>
        </div>
        <div class="progress-control-value ${fillClass}" id="t-prog-value">${displayPct}%</div>
      </div>

      <!-- Target field — kalau diisi, mode counter aktif -->
      <div class="target-row" style="margin-bottom:12px">
        <label>
          🎯 Target (opsional)
          <small>Isi angka kalau task pakai counter — mis: 30 outlet</small>
        </label>
        <div class="target-input-group">
          <input type="number" id="t-target" min="0" placeholder="0" value="${target || ''}" ${readOnly ? 'disabled' : ''}>
        </div>
      </div>

      <!-- Counter mode (visible kalau target > 0) -->
      <div id="t-counter-wrap" class="target-row" style="display:${useCounter ? 'flex' : 'none'}">
        <label>Terlaksana</label>
        <button type="button" class="target-step-btn" id="t-target-minus" ${readOnly ? 'disabled' : ''}>−</button>
        <div class="target-input-group">
          <input type="number" id="t-progress-count" min="0" max="${target || ''}" value="${count}" ${readOnly ? 'disabled' : ''}>
        </div>
        <button type="button" class="target-step-btn" id="t-target-plus" ${readOnly ? 'disabled' : ''}>+</button>
        <div class="target-display ${count >= target && target > 0 ? 'done' : ''}" id="t-target-display">${count} / ${target || '∞'}</div>
      </div>

      <!-- Slider mode (visible kalau target = 0) -->
      <div id="t-slider-wrap" style="display:${useCounter ? 'none' : 'block'}">
        <input type="range" id="t-progress" class="progress-slider" min="0" max="100" step="5" value="${p}" ${readOnly ? 'disabled' : ''}>
        <div class="progress-quick-row">
          ${[0, 25, 50, 75, 100].map(qp =>
            `<button type="button" class="progress-quick-btn ${p === qp ? 'active' : ''}" data-progress-set="${qp}" ${readOnly ? 'disabled' : ''}>${qp}%</button>`
          ).join('')}
        </div>
      </div>
    </div>
  `;

function renderTimeTracker(task) {
  const total = totalTimeMinutes(task);
  const active = activeTimerSession(task); // session aktif by current member
  const log = task?.timeLog || [];
  const me = STATE.currentMember;
  // v2.23: deteksi session running by orang lain (info-only)
  const otherActive = (log || []).filter(s => s.startedAt && !s.endedAt && (!me || s.memberId !== me.id));
  // Only show button kalau user bisa edit task
  const canTrack = canEditTask(task);

  const sessions = log.slice().reverse().slice(0, 10).map(s => {
    const dur = s.duration
      ? Math.round(s.duration / 60000)
      : (s.startedAt && s.endedAt ? Math.round((s.endedAt - s.startedAt) / 60000) : 0);
    const startD = s.startedAt ? new Date(s.startedAt) : null;
    const dateStr = startD ? `${String(startD.getDate()).padStart(2,'0')}/${String(startD.getMonth()+1).padStart(2,'0')} ${String(startD.getHours()).padStart(2,'0')}:${String(startD.getMinutes()).padStart(2,'0')}` : '';
    return `
      <div class="time-tracker-session">
        <span>${escapeHtml(s.memberName || '?')} · ${dateStr}</span>
        <span style="font-family:var(--font-mono);font-weight:600">${dur > 0 ? fmtMinutes(dur) : (s.endedAt ? '0m' : '⏵ running')}</span>
      </div>
    `;
  }).join('');

  // v2.24: AUTO mode — gak ada tombol Start/Stop manual lagi. Timer jalan otomatis
  // saat task PROSES, stop otomatis saat status berubah. Tampilan info-only.
  return `
    <div class="form-group">
      <label class="label">⏱️ Time Tracker (otomatis)</label>
      <div class="time-tracker-box">
        <div class="time-tracker-row">
          <div class="time-tracker-display">
            <div class="time-tracker-label">Total Waktu</div>
            <div class="time-tracker-total ${active ? 'time-tracker-running' : ''}">${total > 0 ? fmtMinutes(total) : '—'}${active ? ' (running)' : ''}</div>
          </div>
          <div style="font-size:11px;color:var(--text-light);text-align:right;max-width:180px;line-height:1.3">
            Timer auto-jalan saat status <strong>Proses</strong>, auto-stop saat keluar dari Proses
          </div>
        </div>
        ${otherActive.length > 0 ? `
          <div class="time-tracker-other-active" style="margin-top:8px;padding:8px 10px;background:#fef3c7;border-left:3px solid #f59e0b;border-radius:4px;font-size:12px;color:#92400e">
            ⏳ Timer berjalan oleh: ${otherActive.map(s => escapeHtml(s.memberName || '?')).join(', ')}
          </div>
        ` : ''}
        ${log.length > 0 ? `
          <div class="time-tracker-sessions">
            <div class="time-tracker-label" style="margin-bottom:6px">Sessions (${log.length})</div>
            ${sessions}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderCommentsSection(task) {
  const comments = task.comments || [];
  const me = STATE.currentMember;

function bindCommentForm(task) {
  const btn = document.getElementById('comment-submit');
  const input = document.getElementById('comment-input');
  if (!btn || !input) return;
  // v2.24: @mention picker
  setupMentionPicker(input);
  btn.addEventListener('click', async () => {
    const text = input.value.trim();
    if (!text) return;
    const me = STATE.currentMember;
    // v2.22: parse mentions di comment
    const { mentionedIds } = parseMentions(text);
    const newComment = {
      id: uid(),
      authorId: me.id,
      authorName: me.name,
      text,
      mentions: mentionedIds,
      createdAt: new Date().toISOString(),
    };
    try {
      await updateDoc(doc(STATE.db, 'tasks', task.id), {
        comments: arrayUnion(newComment),
        updatedAt: serverTimestamp(),
      });
      input.value = '';
      toast('Comment terkirim', 'success');
      // Re-render comments via state refresh — listener will update
      // But also update local task for immediate UX
      task.comments = [...(task.comments || []), newComment];
      // FIX v2.17: pakai DOM API + temp div, tidak regex (anti-crash kalau structure berubah)
      const list = document.getElementById('comments-list');
      if (list) {
        const tmp = document.createElement('div');
        tmp.innerHTML = renderCommentsSection(task);
        const newList = tmp.querySelector('#comments-list');
        if (newList) {
          list.replaceWith(newList);
          bindCommentDelete(task);
        }
      }
    } catch (err) {
      toast('Gagal kirim: ' + err.message, 'error');
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) btn.click();
  });
}

function bindCommentDelete(task) {
  document.querySelectorAll('[data-del-comment]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.delComment, 10);
      const target = (task.comments || [])[idx];
      if (!target) return;
      if (!confirm('Hapus comment ini?')) return;
      try {
        // v2.23: pakai fresh task dari STATE + filter by comment id (lebih reliable dari arrayRemove
        // yang butuh exact field match — kalau ada field tambahan dari Firestore, gak match)
        const fresh = STATE.tasks.find(t => t.id === task.id) || task;
        const cid = target.id;
        let updatedComments;
        if (cid) {
          updatedComments = (fresh.comments || []).filter(c => c.id !== cid);
        } else {
          // fallback ke arrayRemove kalau comment lama gak punya id
          updatedComments = null;
        }
        await updateDoc(doc(STATE.db, 'tasks', task.id), {
          comments: updatedComments !== null ? updatedComments : arrayRemove(target),
          updatedAt: serverTimestamp(),
        });
        toast('Comment dihapus', 'success');
      } catch (err) {
        toast('Gagal hapus: ' + err.message, 'error');
      }
    });
  });
}

async function updateTaskStatus(taskId, newStatus) {
  const task = STATE.tasks.find(t => t.id === taskId);
  if (!task) return;
  const me = STATE.currentMember;
  const newProgress = statusToProgress(newStatus, task.progress);
  const update = {
    status: newStatus,
    progress: newProgress,
    updatedAt: serverTimestamp(),
  };
  if (newStatus === 'done' && task.status !== 'done') update.completedAt = serverTimestamp();
  if (newStatus !== 'done' && task.status === 'done') update.completedAt = null;
  // v2.24: kalau task ditandai selesai (done), clear flag notCompleted + kendala (assume udah resolve)
  if (newStatus === 'done') {
    if (task.notCompleted) update.notCompleted = false;
    if (task.kendala) update.kendala = null;
  }
  // v2.24: AUTO TIME TRACK — kalau status berubah proses↔non-proses, sync timeLog
  const tt = applyAutoTimeTrack(task, task.status, newStatus, me?.id, me?.name);
  if (tt) update.timeLog = tt.timeLog;

  // Activity log
  const ts = new Date().toISOString();
  const newActivities = [];
  if (task.status !== newStatus) {
    newActivities.push({
      id: uid(), type: 'status_changed',
      byId: me.id, byName: me.name, at: ts,
      from: task.status, to: newStatus,
    });
  }
  if ((task.progress || 0) !== newProgress) {
    newActivities.push({
      id: uid(), type: 'progress_changed',
      byId: me.id, byName: me.name, at: ts,
      from: task.progress || 0, to: newProgress,
    });
  }
  if (newActivities.length > 0) {
    update.activity = [...(task.activity || []), ...newActivities];
  }

  try {
    await updateDoc(doc(STATE.db, 'tasks', taskId), update);
  } catch (err) {
    toast('Gagal update: ' + err.message, 'error');
  }
}

function openMarkNotDoneModal(task) {
  const me = STATE.currentMember;
  if (!me) return;
  const html = `
    <div class="modal-header">
      <h2 class="modal-title">🚫 Tandai Tidak Selesai</h2>
      <button class="modal-close" data-close-modal>&times;</button>
    </div>
    <div class="modal-body" style="padding:20px">
      <div style="background:#fef2f2;border-left:3px solid #dc2626;padding:12px 14px;border-radius:6px;margin-bottom:14px">
        <div style="font-weight:600;color:#991b1b;margin-bottom:4px">Task: ${escapeHtml(task.title)}</div>
        <div style="font-size:12px;color:#7f1d1d">Task ini akan masuk ke menu <strong>🚫 Tidak Selesai</strong> untuk direview. Status di kanban gak berubah, tapi badge "🚫 Tidak Selesai" muncul di card.</div>
      </div>
      <div class="form-group">
        <label class="label">Kenapa task ini tidak bisa diselesaikan? <span style="color:#dc2626">*</span></label>
        <textarea id="nd-kendala" class="textarea" rows="4" placeholder="Mis: nunggu supplier kirim barang, alat rusak, customer cancel, dll" autofocus></textarea>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
          Wajib isi. Tim & admin bisa lihat alasan ini dan koordinasi solusi.
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Batal</button>
      <button class="btn btn-danger" id="nd-submit">🚫 Tandai Tidak Selesai</button>
    </div>
  `;
  showModal(html, { size: 'md' });
  const submitBtn = document.getElementById('nd-submit');
  const input = document.getElementById('nd-kendala');
  submitBtn.addEventListener('click', async () => {
    const reason = input.value.trim();
    if (!reason || reason.length < 5) {
      toast('Alasan minimal 5 karakter', 'error');
      input.focus();
      return;
    }
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    try {
      const update = {
        notCompleted: true,
        kendala: reason,
        notCompletedAt: Date.now(),
        notCompletedBy: { id: me.id, name: me.name },
        updatedAt: serverTimestamp(),
      };
      // Stop timer kalau lagi running
      const tt = applyAutoTimeTrack(task, task.status, 'todo', me.id, me.name);
      if (tt) update.timeLog = tt.timeLog;
      // Activity log
      const newAct = {
        id: uid(),
        type: 'marked_not_completed',
        byId: me.id, byName: me.name,
        at: new Date().toISOString(),
        reason,
      };
      update.activity = [...(task.activity || []), newAct];
      await updateDoc(doc(STATE.db, 'tasks', task.id), update);
      toast('Task ditandai tidak selesai', 'success');
      closeModal();
    } catch (err) {
      submitBtn.disabled = false;
      toast('Gagal: ' + err.message, 'error');
    }
  });
  // Ctrl+Enter submit
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitBtn.click();
  });
}

/* =============================================================
   RIWAYAT PENGERJAAN MODAL (timeline activity)
   ============================================================= */
function openHistoryModal(taskId) {
  const task = STATE.tasks.find(t => t.id === taskId);
  if (!task) return;

  // Build timeline events
  const events = [];
  const activity = task.activity || [];

  // Selalu include "created" sebagai event pertama kalau ada
  if (activity.length > 0) {
    activity.forEach(a => {
      let label, markerClass = 'todo', icon = '·';
      switch (a.type) {
        case 'created':
          label = 'To do'; markerClass = 'created'; icon = '+';
          break;
        case 'status_changed':
          label = (a.to || '').toUpperCase().charAt(0) + (a.to || '').slice(1);
          markerClass = a.to === 'done' ? 'done' : (a.to === 'proses' ? 'proses' : 'todo');
          icon = a.to === 'done' ? '✓' : (a.to === 'proses' ? '◐' : '○');
          break;
        case 'progress_changed':
          label = `Progress: ${a.to}%`;
          markerClass = 'progress';
          icon = '%';
          break;
        case 'assignee_changed':
          label = `Pelaksana → ${a.to || '?'}`;
          markerClass = 'todo';
          icon = '👤';
          break;
        default:
          label = a.type;
      }
      events.push({ ...a, label, markerClass, icon });
    });
  } else {
    // Tidak ada activity tracker — fallback ke createdAt + completedAt
    if (task.createdAt) {
      events.push({
        type: 'created', label: 'Dibuat',
        markerClass: 'created', icon: '+',
        byName: task.createdByName, at: task.createdAt,
      });
    }
    if (task.completedAt) {
      events.push({
        type: 'completed', label: 'Selesai',
        markerClass: 'done', icon: '✓',
        byName: task.assigneeName, at: task.completedAt,
      });
    }
  }

  // Format date/time
  function fmtDateTime(at) {
    if (!at) return '';
    const d = typeof at === 'string' ? new Date(at) : (at.toDate ? at.toDate() : new Date(at));
    const dd = String(d.getDate()).padStart(2, '0');
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const mm = months[d.getMonth()];
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return { date: `${dd} ${mm} ${yyyy}`, time: `${hh}.${min}` };
  }

  const itemsHtml = events.map(ev => {
    const dt = fmtDateTime(ev.at);
    return `
      <div class="timeline-item">
        <div class="timeline-marker ${ev.markerClass}">${ev.icon}</div>
        <div class="timeline-status">${escapeHtml(ev.label)}</div>
        ${ev.byName ? `<div class="timeline-detail">oleh <strong>${escapeHtml(ev.byName)}</strong></div>` : ''}
        <div class="timeline-meta">
          <span class="timeline-meta-item">📅 ${dt.date || ''}</span>
          <span class="timeline-meta-item">🕐 ${dt.time || ''}</span>
        </div>
      </div>
    `;
  }).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">🕐 Riwayat Pengerjaan</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:18px">
        Task: <strong style="color:var(--text)">${escapeHtml(task.title)}</strong>
      </div>
      ${events.length > 0
        ? `<div class="timeline">${itemsHtml}</div>`
        : `<div style="color:var(--text-light);text-align:center;padding:24px;font-size:13px">Belum ada riwayat aktivitas</div>`}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close-modal>Tutup</button>
    </div>
  `);
}

      await addDoc(collection(STATE.db, 'boards'), {
        name, color: selectedColor,
        createdById: me.id, createdByName: me.name,
        createdAt: serverTimestamp(),
        archived: false,
      });
      toast(`Board "${name}" dibuat`, 'success');
      closeModal();
      setTimeout(openBoardsModal, 200);
    } catch (err) {
      toast('Gagal: ' + err.message, 'error');
    }
  });

  document.querySelectorAll('[data-rename-board]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.renameBoard;
      const b = STATE.boards.find(x => x.id === id);
      const newName = prompt('Nama board baru:', b.name);
      if (!newName || newName.trim() === b.name) return;
      try {
        await updateDoc(doc(STATE.db, 'boards', id), { name: newName.trim() });
        toast('Board di-rename', 'success');
        setTimeout(openBoardsModal, 200);
      } catch (err) {
        toast('Gagal: ' + err.message, 'error');
      }
    });
  });

  document.querySelectorAll('[data-archive-board]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.archiveBoard;
      const b = STATE.boards.find(x => x.id === id);
      if (!confirm(`Arsipkan board "${b.name}"?\nBoard ini akan hilang dari switcher. Task di dalamnya tetap ada di Firestore tapi tidak terlihat.`)) return;
      try {
        await updateDoc(doc(STATE.db, 'boards', id), { archived: true });
        toast('Board di-arsipkan', 'success');
        closeModal();
      } catch (err) {
        toast('Gagal: ' + err.message, 'error');
      }
    });
  });
}

/* =============================================================
   LABELS MODAL
   ============================================================= */
function openLabelsModal() {
  const canEdit = hasPerm('labels');
  const board = STATE.boards.find(b => b.id === STATE.currentBoardId);
  if (!board) return;

  const colorOpts = PALETTE.map((p, i) =>
    `<button type="button" class="color-swatch ${i === 0 ? 'active' : ''}" style="background:${p.value};color:${p.value}" data-new-label-color="${p.value}" title="${p.name}"></button>`
  ).join('');

  // Sort labels by priority asc untuk preview di list
  const sortedLabels = STATE.labels.slice().sort((a, b) =>
    (Number(a.priority) || 50) - (Number(b.priority) || 50));
  const list = sortedLabels.map(l => {
    const taskCount = STATE.tasks.filter(t => (t.labelIds || []).includes(l.id)).length;
    const pri = Number(l.priority) || 50;
    return `
      <div class="member-row">
        <span class="label-chip" style="background:${l.color}">${escapeHtml(l.name)}</span>
        <div class="member-info">
          <div class="member-meta">${taskCount} task · prioritas <strong>${pri}</strong> ${pri <= 5 ? '🔥' : ''}</div>
        </div>
        <div class="member-actions">
          ${canEdit ? `
            <button class="btn btn-secondary btn-sm" data-priority-label="${l.id}">Prioritas</button>
            <button class="btn btn-secondary btn-sm" data-rename-label="${l.id}">Rename</button>
            <button class="btn btn-danger btn-sm" data-del-label="${l.id}">Hapus</button>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">🏷️ Labels</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:12px;margin-bottom:14px">
        Labels dipakai untuk tag task (mis: Segera, Harian, Mingguan, dll). ${canEdit ? '' : '<strong>Mode lihat saja</strong> — minta admin untuk kasih izin edit.'}
      </p>
      ${canEdit ? `
        <div style="margin-bottom:18px;padding:12px 14px;background:var(--bg-col);border-radius:var(--radius)">
          <label class="label">Bikin Label Baru</label>
          <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
            <input id="new-label-name" class="input" placeholder="Mis: Urgent, Routine" style="flex:1;min-width:160px">
            <div class="color-picker" id="new-label-colors">${colorOpts}</div>
          </div>
          <button class="btn btn-primary btn-sm" id="new-label-add" style="margin-top:10px">+ Bikin Label</button>
        </div>
      ` : ''}
      <h4 style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Daftar Labels</h4>
      ${STATE.labels.length === 0 ? '<div style="color:var(--text-light);font-size:13px;text-align:center;padding:20px">Belum ada label.</div>' : `<div class="member-list">${list}</div>`}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Tutup</button>
    </div>
  `, { size: 'lg' });

  if (!canEdit) return;

  let selectedColor = PALETTE[0].value;
  document.querySelectorAll('[data-new-label-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedColor = btn.dataset.newLabelColor;
      document.querySelectorAll('[data-new-label-color]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  document.getElementById('new-label-add').addEventListener('click', async () => {
    const name = document.getElementById('new-label-name').value.trim();
    if (!name) { toast('Nama label wajib diisi', 'error'); return; }
    try {
      await addDoc(collection(STATE.db, 'boards', STATE.currentBoardId, 'labels'), {
        name, color: selectedColor, priority: 50, createdAt: serverTimestamp(),
      });
      toast(`Label "${name}" dibuat`, 'success');
      closeModal();
      setTimeout(openLabelsModal, 200);
    } catch (err) {
      toast('Gagal: ' + err.message, 'error');
    }
  });

  document.querySelectorAll('[data-priority-label]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.priorityLabel;
      const l = STATE.labels.find(x => x.id === id);
      const cur = Number(l.priority) || 50;
      const input = prompt(`Set prioritas label "${l.name}" (1 = paling tinggi, 99 = paling rendah):\nDefault tim:\n  Segera=1, Harian=2, Mingguan=3, Bulanan=4, Insidental=5`, cur);
      if (input === null) return;
      const num = parseInt(input, 10);
      if (isNaN(num) || num < 1 || num > 99) { toast('Angka 1-99 saja', 'error'); return; }
      try {
        await updateDoc(doc(STATE.db, 'boards', STATE.currentBoardId, 'labels', id), { priority: num });
        toast(`Prioritas ${l.name} = ${num}`, 'success');
        setTimeout(openLabelsModal, 200);
      } catch (err) {
        toast('Gagal: ' + err.message, 'error');
      }
    });
  });

  document.querySelectorAll('[data-rename-label]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.renameLabel;
      const l = STATE.labels.find(x => x.id === id);
      const newName = prompt('Nama label baru:', l.name);
      if (!newName || newName.trim() === l.name) return;
      try {
        await updateDoc(doc(STATE.db, 'boards', STATE.currentBoardId, 'labels', id), { name: newName.trim() });
        toast('Label di-rename', 'success');
        setTimeout(openLabelsModal, 200);
      } catch (err) {
        toast('Gagal: ' + err.message, 'error');
      }
    });
  });

  document.querySelectorAll('[data-del-label]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.delLabel;
      const l = STATE.labels.find(x => x.id === id);
      if (!confirm(`Hapus label "${l.name}"?\nTask yang punya label ini akan kehilangan tag-nya.`)) return;
      try {
        await deleteDoc(doc(STATE.db, 'boards', STATE.currentBoardId, 'labels', id));
        toast('Label dihapus', 'success');
        setTimeout(openLabelsModal, 200);
      } catch (err) {
        toast('Gagal: ' + err.message, 'error');
      }
    });
  });
}

/* =============================================================
   TEMPLATES MODAL
   ============================================================= */
function openTemplatesModal() {
  const canEdit = hasPerm('templates');
  const board = STATE.boards.find(b => b.id === STATE.currentBoardId);
  if (!board) return;

  const freqLabel = {
    manual: { txt: 'Manual', color: 'var(--text-muted)' },
    daily: { txt: '🗓️ Harian', color: '#dc2626' },
    weekly: { txt: '📆 Mingguan', color: '#2563eb' },
    monthly: { txt: '📅 Bulanan', color: '#c87f1f' },
  };
  const dowNames = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const list = STATE.templates.map(t => {
    const freq = t.frequency || 'manual';
    const fl = freqLabel[freq] || freqLabel.manual;
    const itemCount = (t.items || []).length || (t.title ? 1 : 0);
    const assignee = STATE.members.find(m => m.id === t.defaultAssigneeId);
    const isInactive = t.active === false;
    // Day-of-week badge
    const dowArr = Array.isArray(t.daysOfWeek) ? t.daysOfWeek.map(Number) : [0,1,2,3,4,5,6];
    let dowText = '';
    if (dowArr.length === 7) dowText = 'Setiap hari';
    else if (dowArr.length === 5 && [1,2,3,4,5].every(d => dowArr.includes(d))) dowText = 'Sen-Jum';
    else dowText = dowArr.sort((a,b) => (a===0?7:a) - (b===0?7:b)).map(d => dowNames[d]).join('·');
    const sharedNote = t.defaultIsShared ? ' · <span style="color:#15803d;font-weight:600">👥 Bersama</span>' : '';
    return `
      <div class="member-row" style="${isInactive ? 'opacity:0.6' : ''}">
        <div class="member-info">
          <div class="member-name">
            ${escapeHtml(t.name)}
            <span style="font-size:11px;padding:2px 8px;border-radius:100px;background:var(--bg-col);color:${fl.color};font-weight:700;margin-left:6px">${fl.txt}</span>
            ${isInactive ? '<span style="font-size:11px;padding:2px 8px;border-radius:100px;background:var(--bg-col);color:var(--text-light);margin-left:4px">Nonaktif</span>' : ''}
          </div>
          <div class="member-meta">
            🗓️ ${dowText} · ${itemCount} item${assignee ? ` · ke ${escapeHtml(assignee.name)}` : ''}${sharedNote}
          </div>
        </div>
        <div class="member-actions">
          ${canEdit ? `
            <button class="btn btn-secondary btn-sm" data-edit-tpl="${t.id}">Edit</button>
            <button class="btn btn-danger btn-sm" data-del-tpl="${t.id}">Hapus</button>
          ` : `
            <button class="btn btn-ghost-soft btn-sm" data-view-tpl="${t.id}">👁️ Lihat</button>
          `}
        </div>
      </div>
    `;
  }).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">📋 Templates</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-muted);font-size:12px;margin-bottom:14px">
        Template dipakai saat bikin task baru atau auto-generate harian/mingguan/bulanan. ${canEdit ? '' : '<strong>Mode lihat saja</strong> — minta admin untuk kasih izin edit.'}
      </p>
      ${canEdit ? `<button class="btn btn-primary" id="new-tpl-btn" style="margin-bottom:18px">+ Bikin Template Baru</button>` : ''}
      <h4 style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Daftar Templates</h4>
      ${STATE.templates.length === 0 ? '<div style="color:var(--text-light);font-size:13px;text-align:center;padding:20px">Belum ada template.</div>' : `<div class="member-list">${list}</div>`}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Tutup</button>
    </div>
  `, { size: 'lg' });

  if (canEdit) {
    document.getElementById('new-tpl-btn').addEventListener('click', () => openTemplateEditor(null));
    document.querySelectorAll('[data-edit-tpl]').forEach(btn => {
      btn.addEventListener('click', () => openTemplateEditor(btn.dataset.editTpl));
    });
    document.querySelectorAll('[data-del-tpl]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.delTpl;
        const t = STATE.templates.find(x => x.id === id);
        if (!confirm(`Hapus template "${t.name}"?`)) return;
        try {
          await deleteDoc(doc(STATE.db, 'boards', STATE.currentBoardId, 'templates', id));
          toast('Template dihapus', 'success');
          setTimeout(openTemplatesModal, 200);
        } catch (err) {
          toast('Gagal: ' + err.message, 'error');
        }
      });
    });
  } else {
    // View-only mode untuk member
    document.querySelectorAll('[data-view-tpl]').forEach(btn => {
      btn.addEventListener('click', () => openTemplateViewer(btn.dataset.viewTpl));
    });
  }
}

function openTemplateViewer(tplId) {
  const tpl = STATE.templates.find(t => t.id === tplId);
  if (!tpl) return;
  const freqLabel = {
    manual: 'Manual (pakai saat create task)',
    daily: '🗓️ Harian — auto setiap hari',
    weekly: '📆 Mingguan — auto tiap hari yang ditentukan',
    monthly: '📅 Bulanan — auto tiap tanggal yang ditentukan',
  };
  const freq = tpl.frequency || 'manual';
  const assignee = STATE.members.find(m => m.id === tpl.defaultAssigneeId);
  const cat = CATEGORIES.find(c => c.id === tpl.defaultCategoryId);
  const items = tpl.items || [];

  showModal(`
    <div class="modal-header">
      <div class="modal-title">👁️ ${escapeHtml(tpl.name)}</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <div class="task-meta-row" style="display:flex;flex-direction:column;align-items:stretch;gap:6px">
        <div><strong>Frekuensi:</strong> ${freqLabel[freq] || freq}</div>
        ${assignee ? `<div><strong>Pelaksana default:</strong> ${escapeHtml(assignee.name)}</div>` : ''}
        ${cat ? `<div><strong>Kategori default:</strong> ${escapeHtml(cat.name)}</div>` : ''}
        <div><strong>Status:</strong> ${tpl.active === false ? 'Nonaktif' : 'Aktif'}</div>
      </div>
      <h4 class="comments-title" style="margin-top:14px">Item Tugas (${items.length})</h4>
      ${items.length === 0 ? '<div style="color:var(--text-light);font-size:13px;padding:10px">Belum ada item.</div>' :
        items.map((it, idx) => `
          <div class="checklist-block" style="margin-bottom:8px">
            <div style="font-weight:600;font-size:13.5px;margin-bottom:4px">${idx + 1}. ${escapeHtml(it.title || '')}</div>
            ${it.description ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">${escapeHtml(it.description)}</div>` : ''}
            ${Array.isArray(it.checklist) && it.checklist.length > 0
              ? `<div style="font-size:12px;color:var(--text);margin-top:6px">
                  <div style="font-weight:600;font-size:11px;color:var(--text-muted);margin-bottom:4px">Checklist:</div>
                  ${it.checklist.map(c => `<div style="padding-left:8px;line-height:1.5">☐ ${escapeHtml(c)}</div>`).join('')}
                </div>`
              : ''}
          </div>
        `).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Tutup</button>
    </div>
  `, { size: 'lg' });
}

function openTemplateEditor(tplId) {
  const tpl = tplId ? STATE.templates.find(t => t.id === tplId) : null;
  const isEdit = !!tpl;

  // Normalize items — kalau template lama pakai title/description/checklists single, convert ke items[0]
  let initialItems = tpl?.items;
  if (!initialItems || !Array.isArray(initialItems) || initialItems.length === 0) {
    // backward compat
    if (tpl && (tpl.title || (tpl.checklists?.length || 0) > 0)) {
      initialItems = [{
        id: uid(),
        title: tpl.title || tpl.name || '',
        description: tpl.description || '',
        checklist: (tpl.checklists || []).join('\n'),
      }];
    } else {
      initialItems = [{ id: uid(), title: '', description: '', checklist: '' }];
    }
  } else {
    // Convert existing items checklist-array to text for editing
    initialItems = initialItems.map(i => ({
      id: i.id || uid(),
      title: i.title || '',
      description: i.description || '',
      checklist: Array.isArray(i.checklist) ? i.checklist.join('\n') : (i.checklist || ''),
    }));
  }

  const freq = tpl?.frequency || 'daily';
  const defaultAssigneeId = tpl?.defaultAssigneeId || '';
  const defaultCategoryId = tpl?.defaultCategoryId || '';
  const isActive = tpl?.active !== false;
  // Days of week: array of 0-6. Default semua hari (= setiap hari) kalau gak di-set.
  const initialDaysOfWeek = Array.isArray(tpl?.daysOfWeek) && tpl.daysOfWeek.length > 0
    ? tpl.daysOfWeek.map(Number) : [0, 1, 2, 3, 4, 5, 6];
  const defaultIsShared = tpl?.defaultIsShared === true;

  const memberOpts = `<option value="">— Tidak di-set —</option>` + STATE.members.map(m =>
    `<option value="${m.id}" ${m.id === defaultAssigneeId ? 'selected' : ''}>${escapeHtml(m.name)}</option>`
  ).join('');

  const catOpts = `<option value="">— Tidak di-set —</option>` + CATEGORIES.map(c =>
    `<option value="${c.id}" ${c.id === defaultCategoryId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`
  ).join('');

  showModal(`
    <div class="modal-header">
      <div class="modal-title">${isEdit ? 'Edit' : 'Bikin'} Template</div>
      <button class="modal-close" data-close-modal>×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="label">Nama Template</label>
        <input id="tpl-name" class="input" placeholder="Mis: Tugas Harian Prayoga, Restock Mingguan" value="${escapeHtml(tpl?.name || '')}">
      </div>

      <div class="form-group">
        <label class="label">Auto-Generate di Hari</label>
        <div class="chip-row" id="tpl-dow-chips" style="gap:6px;flex-wrap:wrap">
          ${[
            { i: 1, name: 'Sen' },
            { i: 2, name: 'Sel' },
            { i: 3, name: 'Rab' },
            { i: 4, name: 'Kam' },
            { i: 5, name: 'Jum' },
            { i: 6, name: 'Sab' },
            { i: 0, name: 'Min' },
          ].map(d => `
            <button type="button" class="chip ${initialDaysOfWeek.includes(d.i) ? 'active' : ''}"
              data-tpl-dow="${d.i}"
              style="min-width:50px;justify-content:center">${d.name}</button>
          `).join('')}
        </div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button type="button" class="btn btn-ghost btn-sm" id="tpl-dow-all">Semua hari</button>
          <button type="button" class="btn btn-ghost btn-sm" id="tpl-dow-weekday">Sen-Jum aja</button>
          <button type="button" class="btn btn-ghost btn-sm" id="tpl-dow-clear">Kosongkan</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">
          Pilih hari-hari template akan auto-generate task. Default: setiap hari.
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="form-group">
          <label class="label">Pelaksana Default</label>
          <select id="tpl-assignee" class="select">${memberOpts}</select>
        </div>
        <div class="form-group">
          <label class="label">Kategori Default</label>
          <select id="tpl-category" class="select">${catOpts}</select>
        </div>
      </div>

      <div class="form-group" style="padding:10px 14px;background:${defaultIsShared ? 'var(--success-light)' : 'var(--bg-col)'};border-radius:var(--radius-sm);transition:background .2s" id="tpl-shared-wrap">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px">
          <input type="checkbox" id="tpl-shared" ${defaultIsShared ? 'checked' : ''} style="width:16px;height:16px;cursor:inherit;accent-color:var(--success)">
          👥 Default jadi Tugas Bersama
        </label>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;padding-left:24px">
          Kalau dicentang, task auto-generate dari template ini = tugas bersama (muncul di kanban semua anggota tim).
        </div>
      </div>

      <div class="form-group" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="tpl-active" ${isActive ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer">
        <label for="tpl-active" style="cursor:pointer;font-size:13px">Template aktif (auto-generate)</label>
      </div>

      <div class="form-group">
        <label class="label">Daftar Tugas (Item) — tiap item = 1 task</label>
        <div id="tpl-items-root"></div>
        <button type="button" class="btn btn-secondary btn-sm" id="tpl-add-item" style="margin-top:8px">+ Tambah Item Tugas</button>
        <div style="font-size:12px;color:var(--text-muted);margin-top:6px">
          Saat template auto-generate, tiap item akan jadi task terpisah di kanban hari itu.
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close-modal>Batal</button>
      <button class="btn btn-primary" id="tpl-save">${isEdit ? 'Simpan' : 'Bikin Template'}</button>
    </div>
  `, { size: 'lg' });

  // Mutable items state + day-of-week selection
  const ITEMS_STATE = { items: [...initialItems] };
  const TPL_STATE = {
    daysOfWeek: new Set(initialDaysOfWeek),
    defaultIsShared: defaultIsShared,
  };

  function refreshDowChips() {
    document.querySelectorAll('[data-tpl-dow]').forEach(btn => {
      const i = Number(btn.dataset.tplDow);
      btn.classList.toggle('active', TPL_STATE.daysOfWeek.has(i));
    });
  }
  document.querySelectorAll('[data-tpl-dow]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = Number(btn.dataset.tplDow);
      if (TPL_STATE.daysOfWeek.has(i)) TPL_STATE.daysOfWeek.delete(i);
      else TPL_STATE.daysOfWeek.add(i);
      refreshDowChips();
    });
  });
  document.getElementById('tpl-dow-all')?.addEventListener('click', () => {
    TPL_STATE.daysOfWeek = new Set([0,1,2,3,4,5,6]);
    refreshDowChips();
  });
  document.getElementById('tpl-dow-weekday')?.addEventListener('click', () => {
    TPL_STATE.daysOfWeek = new Set([1,2,3,4,5]);
    refreshDowChips();
  });
  document.getElementById('tpl-dow-clear')?.addEventListener('click', () => {
    TPL_STATE.daysOfWeek = new Set();
    refreshDowChips();
  });

  // Shared toggle
  const sharedCb = document.getElementById('tpl-shared');
  const sharedWrap = document.getElementById('tpl-shared-wrap');
  if (sharedCb) {
    sharedCb.addEventListener('change', () => {
      TPL_STATE.defaultIsShared = sharedCb.checked;
      if (sharedWrap) sharedWrap.style.background = sharedCb.checked ? 'var(--success-light)' : 'var(--bg-col)';
    });
  }

  function refreshItems() {
    const root = document.getElementById('tpl-items-root');
    if (!root) return;
    root.innerHTML = ITEMS_STATE.items.map((it, idx) => `
      <div class="checklist-block" data-item-idx="${idx}" style="margin-bottom:8px">
        <div class="checklist-head">
          <input class="checklist-title" data-tpl-item-title="${idx}" value="${escapeHtml(it.title || '')}" placeholder="Judul item tugas...">
          ${ITEMS_STATE.items.length > 1 ? `<button type="button" class="btn btn-ghost btn-sm" data-tpl-del-item="${idx}" style="color:var(--danger)">✕</button>` : ''}
        </div>
        <textarea class="textarea" data-tpl-item-desc="${idx}" placeholder="Deskripsi (opsional)" style="margin-top:6px;min-height:50px">${escapeHtml(it.description || '')}</textarea>
        <textarea class="textarea" data-tpl-item-checklist="${idx}" placeholder="Checklist (1 item per baris, opsional)" style="margin-top:6px;font-family:ui-monospace,monospace;font-size:12px;min-height:60px">${escapeHtml(it.checklist || '')}</textarea>
      </div>
    `).join('');
    // Bind item inputs
    root.querySelectorAll('[data-tpl-item-title]').forEach(el => {
      el.addEventListener('input', () => { ITEMS_STATE.items[Number(el.dataset.tplItemTitle)].title = el.value; });
    });
    root.querySelectorAll('[data-tpl-item-desc]').forEach(el => {
      el.addEventListener('input', () => { ITEMS_STATE.items[Number(el.dataset.tplItemDesc)].description = el.value; });
    });
    root.querySelectorAll('[data-tpl-item-checklist]').forEach(el => {
      el.addEventListener('input', () => { ITEMS_STATE.items[Number(el.dataset.tplItemChecklist)].checklist = el.value; });
    });
    root.querySelectorAll('[data-tpl-del-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.tplDelItem);
        if (!confirm('Hapus item ini?')) return;
        ITEMS_STATE.items.splice(idx, 1);
        refreshItems();
      });
    });
  }
  refreshItems();

  document.getElementById('tpl-add-item').addEventListener('click', () => {
    ITEMS_STATE.items.push({ id: uid(), title: '', description: '', checklist: '' });
    refreshItems();
  });

  document.getElementById('tpl-save').addEventListener('click', async () => {
    const name = document.getElementById('tpl-name').value.trim();
    if (!name) { toast('Nama template wajib diisi', 'error'); return; }

    // Validate items: minimal 1 item dengan title
    const validItems = ITEMS_STATE.items
      .filter(it => (it.title || '').trim())
      .map(it => ({
        id: it.id || uid(),
        title: it.title.trim(),
        description: (it.description || '').trim(),
        checklist: (it.checklist || '').trim().split('\n').map(l => l.trim()).filter(Boolean),
      }));
    if (validItems.length === 0) { toast('Minimal 1 item tugas dengan judul', 'error'); return; }

    const daysOfWeekArr = Array.from(TPL_STATE.daysOfWeek).sort((a, b) => a - b);
    if (daysOfWeekArr.length === 0) {
      toast('Pilih minimal 1 hari (atau klik "Semua hari")', 'error'); return;
    }
    const data = {
      name,
      frequency: 'daily',  // v2.14: template selalu harian
      daysOfWeek: daysOfWeekArr, // v2.15: array 0-6, hari mana saja generate
      defaultAssigneeId: document.getElementById('tpl-assignee').value || null,
      defaultCategoryId: document.getElementById('tpl-category').value || null,
      defaultIsShared: !!TPL_STATE.defaultIsShared,
      active: document.getElementById('tpl-active').checked,
      dayOfWeek: null,
      dayOfMonth: null,
      items: validItems,
      updatedAt: serverTimestamp(),
    };

    try {
      if (isEdit) {
        await updateDoc(doc(STATE.db, 'boards', STATE.currentBoardId, 'templates', tpl.id), data);
        toast('Template tersimpan', 'success');
      } else {
        data.createdAt = serverTimestamp();
        await addDoc(collection(STATE.db, 'boards', STATE.currentBoardId, 'templates'), data);
        toast('Template dibuat', 'success');
      }
      closeModal();
      setTimeout(openTemplatesModal, 200);
    } catch (err) {
      toast('Gagal: ' + err.message, 'error');
    }
  });
}

/* =============================================================
   NOTIFICATION SETTINGS MODAL
   ============================================================= */
function openNotifSettingsModal() {
  const s = STATE.notifSettings || { ...DEFAULT_NOTIF_SETTINGS };
  const permStatus = ('Notification' in window) ? Notification.permission : 'unsupported';
  const permLabel = {
    'granted': '✅ Diizinkan',
    'denied': '❌ Diblokir (buka settings browser untuk aktifkan)',
